<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>影视搜索</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="title-row">
    <div class="title">
      <span class="dot"></span>
      影视快捷搜索
    </div>
    <div class="source-selector">
      <button class="src-btn active" data-source="cilixiong">磁力熊</button>
      <button class="src-btn" data-source="ffzy">非凡资源</button>
      <button class="src-btn" data-source="dushe3">毒舌</button>
      <button class="src-btn" data-source="jiexi">视频解析</button>
    </div>
  </div>
  <div class="searchrow">
    <input id="kw" type="text" placeholder="电影名称" autocomplete="off">
    <button id="btnSearch">
      <span class="spinner"></span>
      <span class="btxt">搜索</span>
    </button>
  </div>
</div>

<div id="stat" class="stat" style="display:none"></div>
<div id="content"></div>

<div class="mask" id="mask">
  <div class="sheet">
    <div class="sheethead">
      <div class="thumb" id="dThumb"></div>
      <div class="info">
        <h2 id="dName">—</h2>
        <div class="meta" id="dMeta">—</div>
      </div>
      <button class="close" id="btnClose" aria-label="关闭">×</button>
    </div>
    <div class="sheetbody" id="dBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   全局配置与数据源定义
   ============================================================ */
const CONFIG = {
  relay: '/proxy?url=',
  timeout: 20000,
};

let currentSource = 'cilixiong';
let hlsInstance = null;
let detailOpen = false;
let currentDetailItem = null;

let pageState = {
  prevUrl: '',
  nextUrl: '',
  hasPrev: false,
  hasMore: false,
  currentPage: 1,
  totalPages: 1,
  totalCount: 0,
  currentKeyword: ''
};

const SOURCES = {
  /* ------------------------- 磁力熊 ------------------------- */
  cilixiong: {
    name: '磁力熊',
    base: 'https://www.cilixiong.org',
    searchPath: '/e/search/index.php',

    getSearchUrl: function(kw){
      return this.base + this.searchPath;
    },
    getSearchUrlGet: function(kw){
      return this.base + this.searchPath +
        '?searchget=1&classid=1,2&show=title&tempid=1&keyboard=' +
        encodeURIComponent(kw);
    },
    getSearchOptions: function(kw){
      const body = encodeForm({ classid:'1,2', show:'title', tempid:'1', keyboard: kw });
      return {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      };
    },

    parseList: function(html){
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const list = [];
      const seen = new Set();

      const pushItem = (nameEl, yearEl, rankEl, coverEl, href) => {
        if(!nameEl) return;
        const name = nameEl.textContent.trim();
        if(!name || seen.has(href + name)) return;
        seen.add(href + name);

        let cover = '';
        if(coverEl){
          const bg = coverEl.getAttribute('style') || '';
          const m = bg.match(/url\(['"]?([^'")]+)['"]?\)/);
          if(m) cover = m[1];
        }
        list.push({
          name,
          year: yearEl ? yearEl.textContent.trim() : '',
          rank: rankEl ? rankEl.textContent.trim() : '',
          cover: abs(cover, this.base),
          href: abs(href, this.base)
        });
      };

      doc.querySelectorAll('.card.card-cover').forEach(card => {
        const a = card.closest('a') || card.querySelector('a');
        if(!a) return;
        pushItem(
          card.querySelector('.pt-5.lh-1.pb-2.h4') || card.querySelector('h2'),
          card.querySelector('.d-flex.align-items-center.small'),
          card.querySelector('.rank'),
          card.querySelector('.card-img'),
          a.getAttribute('href')
        );
      });

      if(list.length === 0){
        doc.querySelectorAll('a[href*="/movie/"]').forEach(a => {
          const card = a.querySelector('.card') || a;
          pushItem(
            card.querySelector('.pt-5.lh-1.pb-2.h4') || card.querySelector('h2'),
            card.querySelector('.d-flex.align-items-center.small'),
            card.querySelector('.rank'),
            card.querySelector('.card-img'),
            a.getAttribute('href')
          );
        });
      }

      return {
        list,
        prevUrl:'', nextUrl:'', hasPrev:false, hasMore:false,
        currentPage:1, totalPages:1, totalCount: list.length
      };
    },

    parseDetail: function(html){
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const magnets = [];
      const seen = new Set();

      doc.querySelectorAll('a[href^="magnet:"]').forEach(a => {
        const href = a.getAttribute('href');
        if(!href || seen.has(href)) return;
        seen.add(href);
        const text = a.textContent.trim();
        let size = '';
        const m = text.match(/\[([^\]]+)\]\s*$/);
        if(m) size = m[1];
        magnets.push({ title: text || '磁力资源', size, magnet: href });
      });

      let playPageUrl = '';
      const iframe = doc.querySelector('.embed_video iframe') || doc.querySelector('iframe[src*="jx.php"]');
      if(iframe){
        const src = iframe.getAttribute('src') || '';
        if(src) playPageUrl = abs(src, this.base);
      }

      return { magnets, playPageUrl, playList: [] };
    }
  },

  /* ------------------------ 非凡资源 ------------------------ */
  ffzy: {
    name: '非凡资源',
    base: 'https://www.ffzy.tv',

    getSearchUrl: function(kw){
      return this.base + '/index.php/vod/search.html';
    },
    getSearchUrlGet: function(kw){
      return this.base + '/index.php/vod/search.html?wd=' + encodeURIComponent(kw);
    },
    getSearchOptions: function(kw){
      const body = encodeForm({ wd: kw });
      return {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      };
    },

    parseList: function(html){
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const list = [];

      let items = doc.querySelectorAll('ul.videoContent > li');
      if(items.length === 0) items = doc.querySelectorAll('a.videoName');

      items.forEach(node => {
        let a = null;
        let scope = node;
        if(node.tagName === 'A'){
          a = node;
          scope = node.closest('li') || node;
        }else{
          a = node.querySelector('a.videoName') || node.querySelector('a.address');
        }
        if(!a) return;

        const href = a.getAttribute('href');
        if(!href) return;

        const clone = a.cloneNode(true);
        const statusEl = clone.querySelector('i');
        const status = statusEl ? statusEl.textContent.trim() : '';
        if(statusEl) statusEl.remove();
        const name = clone.textContent.trim() || '未知片名';

        const regionEl = scope.querySelector('.region');
        const typeEl   = scope.querySelector('.category') || scope.querySelector('.type');
        const timeEl   = scope.querySelector('.time1')    || scope.querySelector('.time');

        list.push({
          name,
          year:   timeEl   ? timeEl.textContent.trim()   : '',
          rank:   typeEl   ? typeEl.textContent.trim()   : '',
          region: regionEl ? regionEl.textContent.trim() : '',
          status,
          cover: '',
          href:  abs(href, this.base)
        });
      });

      let prevUrl = '', nextUrl = '';
      let hasPrev = false, hasMore = false;
      let currentPage = 1, totalPages = 1, totalCount = list.length;

      const pageBox = doc.querySelector('.pages') || doc.querySelector('.page') || doc.querySelector('.kscont');
      if(pageBox){
        const prevA = pageBox.querySelector('a[title="上一页"]');
        if(prevA){
          const phref = prevA.getAttribute('href') || '';
          if(phref && !phref.includes('javascript:') && phref !== '#'){
            prevUrl = abs(phref, this.base);
            hasPrev = true;
          }
        }

        const nextA = pageBox.querySelector('a[title="下一页"]');
        if(nextA){
          const nhref = nextA.getAttribute('href') || '';
          if(nhref && !nhref.includes('javascript:') && nhref !== '#'){
            nextUrl = abs(nhref, this.base);
            hasMore = true;
          }
        }

        const statSpan = pageBox.querySelector('span.disabled') || pageBox;
        const text = statSpan ? (statSpan.textContent || '') : '';
        const m = text.match(/共\s*(\d+)\s*条数据.*?当前\s*(\d+)\s*\/\s*(\d+)\s*页/);
        if(m){
          totalCount  = parseInt(m[1], 10) || list.length;
          currentPage = parseInt(m[2], 10) || 1;
          totalPages  = parseInt(m[3], 10) || 1;
        }else{
          const activeSpan = pageBox.querySelector('span.active');
          if(activeSpan){
            const num = parseInt(activeSpan.textContent, 10);
            if(!isNaN(num)) currentPage = num;
          }
        }
      }

      if(currentPage <= 1){ hasPrev = false; prevUrl = ''; }
      if(currentPage >= totalPages){ hasMore = false; nextUrl = ''; }

      return { list, prevUrl, nextUrl, hasPrev, hasMore, currentPage, totalPages, totalCount };
    },

    parseDetail: function(html){
      const doc = new DOMParser().parseFromString(html, 'text/html');

      let cover = '';
      const imgEl = doc.querySelector('.left img') || doc.querySelector('.vodImg img');
      if(imgEl) cover = abs(imgEl.getAttribute('src'), this.base);

      const playList = [];
      const seen = new Set();

      doc.querySelectorAll('input[name*="copy_ffm3u8"]').forEach(ipt => {
        const val = (ipt.value || '').trim();
        if(!val.includes('$')) return;
        const idx = val.indexOf('$');
        const quality = val.slice(0, idx).trim() || '正片';
        const url     = val.slice(idx + 1).trim();
        if(!url || seen.has(url)) return;
        seen.add(url);
        playList.push({ title: quality, url });
      });

      if(playList.length === 0){
        const text = doc.body ? (doc.body.innerText || doc.body.textContent || '') : '';
        for(const m of text.matchAll(/([^\n\$]+?)\$((?:https?:\/\/)[^\s\$\n]+?\.m3u8[^\s\$\n]*)/gi)){
          const quality = m[1].trim();
          const url = m[2].trim();
          if(seen.has(url)) continue;
          seen.add(url);
          playList.push({ title: quality, url });
        }
      }

      return { cover, magnets: [], playPageUrl: '', playList };
    }
  },

  /* ------------------------ 毒舌(dushe3) ------------------------ */
  dushe3: {
    name: '毒舌',
    base: 'https://www.dushe3.app',

    getHomeUrl: function(){
      return this.base + '/';
    },
  parseToken: function(html){
    // 允许 t 值里含 URL 编码字符 %XX、+、=、/
    const matches = html.match(/t=([A-Za-z0-9+/=%]+)/g) || [];
    for (let i = 0; i < matches.length; i++){
      const v = matches[i].slice(2);
      if (v && v.length > 6 && v.indexOf('<') === -1 && v.indexOf('>') === -1) {
        return v;
      }
    }
    return '';
  },

  getSearchUrl: function(kw, token){
    // t 若已是 %XX 编码形式，直接用；若是原始 base64，才 encode
    let tEncoded;
    if (token.indexOf('%') !== -1) {
      tEncoded = token;
    } else {
      tEncoded = encodeURIComponent(token);
    }
    return this.base + '/search?t=' + tEncoded +
           '&k=' + encodeURIComponent(kw);
  },

  getSearchUrlGet: function(kw){ return ''; },
  getSearchOptions: function(kw){ return { method:'GET' }; },

  parseList: function(html){
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const list = [];
    const seen = new Set();

    doc.querySelectorAll('a.search-result-item').forEach(a => {
      const href = a.getAttribute('href') || '';
      if (!href || seen.has(href)) return;
      seen.add(href);

      const titleEl = a.querySelector('.search-result-item-main .title');
      const name = titleEl ? titleEl.textContent.trim() : '';
      if (!name) return;

      let cover = '';
      const imgEl = a.querySelector('.search-result-item-pic img');
      if (imgEl){
        const src = imgEl.getAttribute('src') || '';
        const ori = imgEl.getAttribute('data-original') || '';
        cover = (src && src.indexOf('logo_placeholder') === -1)
                  ? src
                  : (ori && ori.indexOf('logo_placeholder') === -1 ? ori : '');
      }

      const tagEls = a.querySelectorAll('.search-result-item-main .tags span');
      let year = '', region = '', type = '';
      if (tagEls.length >= 1) year   = tagEls[0].textContent.trim();
      if (tagEls.length >= 2) region = tagEls[1].textContent.trim();
      if (tagEls.length >= 3) type   = tagEls[2].textContent.trim();

      const subParts = [year, region, type].filter(Boolean);

      list.push({
        name,
        year: subParts.join(' / '),
        rank: '',
        region: region,
        status: '',
        cover: abs(cover, this.base),
        href: abs(href, this.base),
      });
    });

    let nextUrl = '', hasMore = false;
    const nextA = doc.querySelector('.pagenation-box a.page-item-next');
    if (nextA){
      const nhref = nextA.getAttribute('href') || '';
      if (nhref && !nhref.includes('javascript:')){
        nextUrl = abs(nhref, this.base);
        hasMore = true;
      }
    }

    return {
      list,
      prevUrl: '',
      nextUrl,
      hasPrev: false,
      hasMore,
      currentPage: 1,
      totalPages: hasMore ? 2 : 1,
      totalCount: list.length,
    };
  },

  parseDetail: function(html){
    const doc = new DOMParser().parseFromString(html, 'text/html');

    let cover = '';
    const imgEl = doc.querySelector('.detail-pic img, .vod-img img, .pic img');
    if (imgEl) cover = abs(imgEl.getAttribute('src'), this.base);

    const sources = [];
    doc.querySelectorAll('.source-item').forEach(el => {
      const labelEl = el.querySelector('.source-item-label');
      const numEl   = el.querySelector('.source-item-num');
      if (!labelEl) return;
      sources.push({
        name: labelEl.textContent.trim(),
        count: numEl ? parseInt(numEl.textContent.trim(), 10) || 0 : 0,
        active: el.classList.contains('source-item-active'),
      });
    });

    const episodes = [];
    doc.querySelectorAll('.episode-list .episode-item').forEach(a => {
      const href = a.getAttribute('href') || '';
      const spanEl = a.querySelector('span');
      const title = spanEl ? spanEl.textContent.trim() : '';
      if (!href) return;
      episodes.push({
        title: title || ('第 ' + (episodes.length + 1) + ' 集'),
        href: abs(href, this.base),
      });
    });

    return {
      cover,
      magnets: [],
      playPageUrl: '',
      playList: [],
      _sources: sources,
      _episodes: episodes,
    };
  }
}
};

/* ============================================================
   通用工具函数
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 1600);
}

function encodeForm(obj){
  return Object.keys(obj)
    .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(obj[k]))
    .join('&');
}

function abs(url, base){
  if(!url) return '';
  url = String(url).trim();
  if(!url) return '';
  if(url.startsWith('http://') || url.startsWith('https://')) return url;
  if(url.startsWith('//')) return 'https:' + url;
  return base + (url.startsWith('/') ? '' : '/') + url;
}

function fetchWithTimeout(url, options, timeout){
  timeout = timeout || CONFIG.timeout;
  const ctrl = new AbortController();
  const id = setTimeout(()=>ctrl.abort(), timeout);
  return fetch(url, Object.assign({}, options || {}, { signal: ctrl.signal }))
    .finally(()=>clearTimeout(id));
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      return true;
    }catch(err){
      return false;
    }
  }
}

function copyFeedback(btn, label){
  if(!btn) return;
  const old = btn.textContent;
  btn.classList.add('done');
  btn.textContent = label;
  setTimeout(()=>{
    btn.classList.remove('done');
    btn.textContent = old;
  }, 1400);
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s){
  return escapeHtml(s).replace(/`/g,'&#96;');
}

function extractVideoUrl(text){
  if(!text) return '';
  const s = String(text).replace(/\\\//g, '/').replace(/&amp;/g, '&');
  const patterns = [
    /https?:\/\/[^\s"'<>\\]+?\.m3u8[^\s"'<>\\]*/i,
    /https?:\/\/[^\s"'<>\\]+?\.mp4[^\s"'<>\\]*/i,
    /https?:\/\/[^\s"'<>\\]+?\.flv[^\s"'<>\\]*/i,
    /\/\/[^\s"'<>\\]+?\.m3u8[^\s"'<>\\]*/i,
    /\/\/[^\s"'<>\\]+?\.mp4[^\s"'<>\\]*/i,
  ];
  for(let i=0;i<patterns.length;i++){
    const m = s.match(patterns[i]);
    if(m){
      let u = m[0];
      if(u.startsWith('//')) u = 'https:' + u;
      return u;
    }
  }
  return '';
}

function extractM3u8FromPlayPage(html){
  if(!html) return '';
  const mPlayer = html.match(/"url"\s*:\s*"([^"]+\.m3u8[^"]*)"/i);
  if(mPlayer) return mPlayer[1].replace(/\\\//g, '/');
  const mSrc = html.match(/src\s*:\s*["']([^"']+\.m3u8[^"']*)["']/i);
  if(mSrc) return mSrc[1].replace(/\\\//g, '/');
  const mAny = html.match(/https?:\/\/[^\s"'<>\\]+?\.m3u8[^\s"'<>\\]*/i);
  if(mAny) return mAny[0];
  return '';
}

/* ============================================================
   HLS 播放
   ============================================================ */
function destroyHls(){
  const video = document.getElementById('playerVideo');
  if(video){
    try{ video.pause(); }catch(e){}
    try{ video.removeAttribute('src'); video.load(); }catch(e){}
  }
  if(hlsInstance){
    try{ hlsInstance.destroy(); }catch(e){}
    hlsInstance = null;
  }
}

function startHlsPlayer(videoUrl){
  const container = $('#playerContainer');
  const video = $('#playerVideo');
  if(!container || !video || !videoUrl) return;

  destroyHls();
  container.style.display = 'block';

  const playSrc = videoUrl;

  if(typeof Hls !== 'undefined' && Hls.isSupported()){
    hlsInstance = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      manifestLoadingTimeOut: 15000,
      manifestLoadingMaxRetry: 2
    });

    hlsInstance.loadSource(playSrc);
    hlsInstance.attachMedia(video);

    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function(){
      video.play().catch(function(e){ console.log('自动播放被拦截:', e); });
    });

    let triedProxy = false;
    hlsInstance.on(Hls.Events.ERROR, function(event, data){
      if(!data || !data.fatal) return;
      switch(data.type){
        case Hls.ErrorTypes.NETWORK_ERROR:
          if(!triedProxy && !playSrc.startsWith(CONFIG.relay)){
            triedProxy = true;
            console.warn('网络错误，尝试通过中转加载 m3u8');
            hlsInstance.loadSource(CONFIG.relay + encodeURIComponent(videoUrl));
          }else{
            toast('视频加载失败：网络错误');
          }
          break;
        case Hls.ErrorTypes.MEDIA_ERROR:
          try{ hlsInstance.recoverMediaError(); }catch(e){ toast('视频解码失败'); }
          break;
        default:
          destroyHls();
          toast('播放器遇到致命错误');
          break;
      }
    });
  }
  else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = playSrc;
    video.addEventListener('loadedmetadata', function(){
      video.play().catch(function(){});
    }, { once:true });
  }
  else{
    toast('当前浏览器不支持 HLS 播放');
  }
}

/* ============================================================
   网络请求
   ============================================================ */
async function fetchViaRelay(url, opts, timeout){
  const target = CONFIG.relay + encodeURIComponent(url);
  const r = await fetchWithTimeout(target, opts || {}, timeout);
  if(!r.ok) throw new Error('中转返回状态码 ' + r.status);
  return await r.text();
}

async function requestSearch(keyword){
  const src = SOURCES[currentSource];

  // ===== 毒舌：先拿首页 → 抽 t → 拼搜索 URL =====
  if(currentSource === 'dushe3'){
    const homeHtml = await fetchViaRelay(src.getHomeUrl(), {});
    const token = src.parseToken(homeHtml);
    if(!token) throw new Error('未能从首页提取到 t 参数');
    console.log('[dushe3] token =', token);

    const searchUrl = src.getSearchUrl(keyword, token);
    const html = await fetchViaRelay(searchUrl, {});
    if(!html || html.length < 100) throw new Error('搜索结果为空');
    return html;
  }

 /* ================= 毒舌无感解盾辅助逻辑 ================= */
async function autoSolveDusheShield(homeUrl) {
  return new Promise((resolve) => {
    let iframe = document.getElementById('dushe_shield_iframe');
    if (iframe) iframe.remove();

    iframe = document.createElement('iframe');
    iframe.id = 'dushe_shield_iframe';
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    // 监听 Cookie 生成
    const checkTimer = setInterval(() => {
      const match = document.cookie.match(/cdndefend_js_cookie=[^;]+/);
      if (match) {
        clearInterval(checkTimer);
        iframe.remove();
        resolve(match[0]);
      }
    }, 200);

    // 3秒超时保障
    setTimeout(() => {
      clearInterval(checkTimer);
      if (iframe) iframe.remove();
      resolve('');
    }, 3000);

    iframe.src = CONFIG.relay + encodeURIComponent(homeUrl);
  });
}

/* ================= 搜索请求业务逻辑更新 ================= */
async function requestSearch(keyword) {
  const src = SOURCES[currentSource];

  if (currentSource === 'dushe3') {
    let homeHtml = await fetchViaRelay(src.getHomeUrl());
    let token = src.parseToken(homeHtml);

    // 若未拿到 token（触发了 JS 盾），开启无感后台解盾
    if (!token) {
      console.log('[dushe3] 命中 5 秒盾，启动后台无感计算 Cookie...');
      await autoSolveDusheShield(src.getHomeUrl());
      
      // 重新获取首页内容
      homeHtml = await fetchViaRelay(src.getHomeUrl());
      token = src.parseToken(homeHtml);
    }

    if (!token) throw new Error('毒舌源站无响应，请重试');

    const searchUrl = src.getSearchUrl(keyword, token);
    const html = await fetchViaRelay(searchUrl);
    if (!html || html.length < 100) throw new Error('搜索结果为空');
    return html;
  }

  // 其它源逻辑不变...
  const postOpts = src.getSearchOptions(keyword);
  let txt = '';
  try {
    txt = await fetchViaRelay(src.getSearchUrl(), postOpts);
  } catch (e) {
    txt = await fetchViaRelay(src.getSearchUrlGet(keyword), { method: 'GET' });
  }
  return txt;
}


async function requestUrl(url){
  return await fetchViaRelay(url, {});
}

/* ============================================================
   UI 渲染
   ============================================================ */
function renderSkeleton(n){
  n = n || 8;
  let html = '<div class="grid">';
  for(let i=0;i<n;i++){
    html += '<div class="skeleton">' +
      '<div class="sk-cover"></div>' +
      '<div class="sk-line"></div>' +
      '<div class="sk-line short"></div>' +
    '</div>';
  }
  html += '</div>';
  $('#content').innerHTML = html;
  $('#stat').style.display = 'none';
}

function rankClass(r){
  const n = parseFloat(r);
  if(isNaN(n)) return '';
  if(n >= 8) return '';
  if(n >= 6) return 'mid';
  return 'low';
}

function createCardElement(it, index){
  const div = document.createElement('div');
  div.className = 'card';
  div.style.animationDelay = ((index % 12) * 40) + 'ms';

  const rankHtml = it.rank
    ? '<span class="rank ' + rankClass(it.rank) + '">' + escapeHtml(it.rank) + '</span>'
    : '';

  const coverHtml = it.cover
    ? '<img src="' + escapeAttr(it.cover) + '" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">'
    : '';

  const subLine = it.year || it.region || it.status || '';

  div.innerHTML =
    '<div class="cover">' + rankHtml + coverHtml + '</div>' +
    '<div class="cardbody">' +
      '<h3 title="' + escapeAttr(it.name) + '">' + escapeHtml(it.name) + '</h3>' +
      '<div class="year">' + escapeHtml(subLine) + '</div>' +
    '</div>';

  div.addEventListener('animationend', function(){
    div.classList.add('animated');
  }, { once:true });

  div.addEventListener('click', function(){
    openDetail(it);
  });

  return div;
}

function renderCards(list, keyword){
  if(!list || !list.length){
    renderEmpty('没有找到相关影片', keyword);
    return;
  }

  const contentBox = $('#content');
  contentBox.innerHTML = '<div class="grid"></div><div class="pagination-box" id="paginationBox"></div>';
  const grid = contentBox.querySelector('.grid');

  list.forEach((it, i) => {
    grid.appendChild(createCardElement(it, i));
  });

  $('#stat').style.display = 'block';
  $('#stat').innerHTML = '[' + SOURCES[currentSource].name + '] 共 <b>' +
    pageState.totalCount + '</b> 条结果 | 当前第 <b>' +
    pageState.currentPage + '</b> / <b>' + pageState.totalPages + '</b> 页';

  updatePaginationUI();
}

function updatePaginationUI(){
  const box = $('#paginationBox');
  if(!box) return;

  if(pageState.totalPages > 1 || pageState.hasPrev || pageState.hasMore){
    box.className = 'pagination-box';
    box.innerHTML =
      '<button class="btn-page" id="btnPrevPage"' + (pageState.hasPrev ? '' : ' disabled') + '>上一页</button>' +
      '<span class="page-info">第 <b>' + pageState.currentPage + '</b> / <b>' + pageState.totalPages + '</b> 页</span>' +
      '<button class="btn-page" id="btnNextPage"' + (pageState.hasMore ? '' : ' disabled') + '>下一页</button>';

    const prevBtn = $('#btnPrevPage');
    const nextBtn = $('#btnNextPage');

    if(prevBtn && pageState.hasPrev){
      prevBtn.onclick = function(){ gotoPage(pageState.prevUrl); };
    }
    if(nextBtn && pageState.hasMore){
      nextBtn.onclick = function(){ gotoPage(pageState.nextUrl); };
    }
  }else{
    box.className = 'pagination-box';
    box.innerHTML = pageState.totalCount > 0
      ? '<span style="font-size:12px;color:var(--sub)">— 已加载全部搜索结果 —</span>'
      : '';
  }
}

function renderEmpty(msg, keyword){

      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
        '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>' +
      '</svg>' +
      '<p>' + escapeHtml(msg) + '</p>' +

}

function renderError(msg, keyword){

  $('#content').innerHTML =
    '<div class="empty">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
        '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>' +

/* ============================================================
   核心业务
   ============================================================ */
async function doSearch(keyword){
  keyword = (keyword || '').trim();
  if(!keyword){ toast('请输入关键词'); return; }

  pageState.currentKeyword = keyword;
  pageState.prevUrl = '';
  pageState.nextUrl = '';
  pageState.hasPrev = false;
  pageState.hasMore = false;

  const btn = $('#btnSearch');
  btn.classList.add('loading');
  renderSkeleton();

  try{
    const html = await requestSearch(keyword);
    const result = SOURCES[currentSource].parseList(html);

    pageState.prevUrl     = result.prevUrl || '';
    pageState.nextUrl     = result.nextUrl || '';
    pageState.hasPrev     = !!result.hasPrev;
    pageState.hasMore     = !!result.hasMore;
    pageState.currentPage = result.currentPage || 1;
    pageState.totalPages  = result.totalPages || 1;
    pageState.totalCount  = result.totalCount || result.list.length;

    renderCards(result.list, keyword);
  }catch(e){
    console.error(e);
    renderError('请求失败：' + (e.message || '未知错误'), keyword);
  }finally{
    btn.classList.remove('loading');
  }
}

async function gotoPage(targetUrl){
  if(!targetUrl) return;

  renderSkeleton();
  window.scrollTo({ top:0, behavior:'smooth' });

  try{
    const html = await requestUrl(targetUrl);
    const result = SOURCES[currentSource].parseList(html);

    pageState.prevUrl     = result.prevUrl || '';
    pageState.nextUrl     = result.nextUrl || '';
    pageState.hasPrev     = !!result.hasPrev;
    pageState.hasMore     = !!result.hasMore;
    pageState.currentPage = result.currentPage || 1;
    pageState.totalPages  = result.totalPages || 1;
    pageState.totalCount  = result.totalCount || result.list.length;

    renderCards(result.list, pageState.currentKeyword);
  }catch(e){
    console.error(e);
    toast('加载页面失败：' + e.message);
    renderError('页面加载失败：' + (e.message || '未知错误'), pageState.currentKeyword);
  }
}

function closeDetailUI(){
  destroyHls();
  $('#mask').classList.remove('show');
  currentDetailItem = null;
}

function closeDetail(){
  if(!detailOpen) return;
  detailOpen = false;
  closeDetailUI();
  try{ history.back(); }catch(e){}
}

/* ================== 详情页（正确顺序：拼 body → 写入 → 绑定事件）================== */
async function openDetail(item){
  if(detailOpen) return;
  detailOpen = true;
  currentDetailItem = item;

  try{ history.pushState({ detail:true }, ''); }catch(e){}

  $('#mask').classList.add('show');
  $('#dName').textContent = item.name + (item.year ? ' (' + item.year + ')' : '');
  $('#dMeta').textContent = item.rank ? ('信息/评分: ' + item.rank) : (item.region || '');
  $('#dThumb').style.backgroundImage = item.cover ? "url('" + item.cover + "')" : 'none';
  $('#dBody').innerHTML = '<div class="empty" style="padding:30px 0">正在加载资源…</div>';

  try{
    const html = await requestUrl(item.href);
    if(!detailOpen) return;

    const detailData = SOURCES[currentSource].parseDetail(html);

    if(detailData.cover){
      $('#dThumb').style.backgroundImage = "url('" + detailData.cover + "')";
    }

    let body = '';

    // ===== 播放器容器 =====
    body +=
      '<div class="playbox" id="playerBox" style="display:none;">' +
        '<div class="ptitle">▶ 在线播放器</div>' +
        '<div class="paddr ok" id="paddr">已载入播放节点</div>' +
        '<div class="player-container" id="playerContainer">' +
          '<video id="playerVideo" controls playsinline webkit-playsinline></video>' +
        '</div>' +
      '</div>';

    // ===== 播放探测（磁力熊用）=====
    if(detailData.playPageUrl){
      body +=
        '<div class="playbox">' +
          '<div class="ptitle">▶ 播放探测</div>' +
          '<div class="paddr probing" id="paddrProbe">正在探测真实播放地址…</div>' +
          '<div class="row" id="playBtns" style="display:none">' +
            '<button class="btn btn-play-copy">复制链接</button>' +
            '<button class="btn btn-play-open">点击播放</button>' +
          '</div>' +
        '</div>';
    }

    // ===== 在线播放列表（非凡资源用）=====
    if(detailData.playList && detailData.playList.length){
      body += '<div class="section-title">在线播放列表（' + detailData.playList.length + '）</div>';
      body += detailData.playList.map(function(p, i){
        return '<div class="episode-item" style="animation-delay:' + (i * 30) + 'ms">' +
          '<div class="fname" title="' + escapeAttr(p.title) + '">' + escapeHtml(p.title) + '</div>' +
          '<div class="row">' +
            '<div class="btns">' +
              '<button class="btn btn-copy" data-url="' + escapeAttr(p.url) + '">复制 m3u8</button>' +
              '<button class="btn btn-open btn-play-ep" data-url="' + escapeAttr(p.url) + '">立即播放</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    // ===== 磁力资源（磁力熊用）=====
    if(detailData.magnets && detailData.magnets.length){
      body += '<div class="section-title">磁力资源（' + detailData.magnets.length + '）</div>';
      body += detailData.magnets.map(function(m, i){
        return '<div class="magnet" style="animation-delay:' + (i * 30) + 'ms">' +
          '<div class="fname" title="' + escapeAttr(m.title) + '">' + escapeHtml(m.title) + '</div>' +
          '<div class="row">' +
            (m.size ? '<span class="size">' + escapeHtml(m.size) + '</span>' : '') +
            '<div class="btns">' +
              '<button class="btn btn-copy" data-magnet="' + escapeAttr(m.magnet) + '">磁力复制</button>' +
              '<button class="btn btn-open" data-magnet="' + escapeAttr(m.magnet) + '">磁力打开</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    // ===== 毒舌：切换线路 =====
    if(detailData._sources && detailData._sources.length){
      body += '<div class="section-title">切换线路</div>';
      body += '<div class="dushe-sources">';
      detailData._sources.forEach((s, i) => {
        body += '<button class="dushe-source-btn' + (s.active ? ' active' : '') +
                '" data-idx="' + i + '">' +
                '<span class="lbl">' + escapeHtml(s.name) + '</span>' +
                '<span class="num">' + s.count + '</span>' +
                '</button>';
      });
      body += '</div>';
    }

    // ===== 毒舌：选集 =====
    if(detailData._episodes && detailData._episodes.length){
      body += '<div class="section-title">选集播放（' + detailData._episodes.length + '）</div>';
      body += '<div class="dushe-episodes">';
      detailData._episodes.forEach((ep, i) => {
        body += '<button class="dushe-ep-btn btn-play-dushe-ep" ' +
                'data-href="' + escapeAttr(ep.href) + '" ' +
                'data-title="' + escapeAttr(ep.title) + '">' +
                escapeHtml(ep.title) +
                '</button>';
      });
      body += '</div>';
    }

    // ===== 有没有任何可播放内容（只声明一次！）=====
    const hasAnything =
      detailData.playPageUrl ||
      (detailData.magnets && detailData.magnets.length) ||
      (detailData.playList && detailData.playList.length) ||
      (detailData._episodes && detailData._episodes.length);

    if(!hasAnything){
      body += '<div class="empty" style="padding:30px 0"><p>该影片暂未解析到磁力或播放地址</p></div>';
    }

    // ===== 一次性写入 DOM =====
    $('#dBody').innerHTML = body;

    // ===== 以下所有事件绑定，必须在 innerHTML 之后 =====

    // 磁力复制
    $$('#dBody .btn-copy[data-magnet]').forEach(function(b){
      b.onclick = async function(){
        const ok = await copyText(b.dataset.magnet);
        if(ok){ copyFeedback(b, '已复制 ✓'); toast('磁力链接已复制'); }
        else toast('复制失败');
      };
    });

    // 磁力打开
    $$('#dBody .btn-open[data-magnet]').forEach(function(b){
      b.onclick = function(){
        try{ location.href = b.dataset.magnet; }catch(e){ toast('无法打开磁力链接'); }
      };
    });

    // 播放链接复制
    $$('#dBody .btn-copy[data-url]').forEach(function(b){
      b.onclick = async function(){
        const ok = await copyText(b.dataset.url);
        if(ok){ copyFeedback(b, '已复制 ✓'); toast('播放链接已复制'); }
        else toast('复制失败');
      };
    });

    // 播放链接立即播放（非凡资源）
    $$('#dBody .btn-play-ep').forEach(function(b){
      b.onclick = function(){
        const url = b.dataset.url;
        $('#playerBox').style.display = 'block';
        $('#paddr').textContent = url;
        startHlsPlayer(url);
        $('#dBody').scrollTo({ top:0, behavior:'smooth' });
      };
    });

    // 毒舌：线路切换（视觉）
    $$('#dBody .dushe-source-btn').forEach(btn => {
      btn.onclick = function(){
        $$('#dBody .dushe-source-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      };
    });

    // 毒舌：点击集数 → 解析播放页 → 播 m3u8
    $$('#dBody .btn-play-dushe-ep').forEach(btn => {
      btn.onclick = async function(){
        const href = btn.dataset.href;
        if(!href) return;

        $('#playerBox').style.display = 'block';
        $('#paddr').textContent = '正在解析播放地址…';
        $('#paddr').className = 'paddr probing';

        try{
          const playHtml = await requestUrl(href);
          const m3u8 = extractM3u8FromPlayPage(playHtml);
          if(!m3u8){
            $('#paddr').className = 'paddr fail';
            $('#paddr').textContent = '未找到 m3u8 播放地址';
            toast('未找到播放地址');
            return;
          }
          $('#paddr').className = 'paddr ok';
          $('#paddr').textContent = m3u8;
          startHlsPlayer(m3u8);
          toast('开始播放：' + btn.dataset.title);
          $('#dBody').scrollTo({ top:0, behavior:'smooth' });
        }catch(e){
          console.error(e);
          $('#paddr').className = 'paddr fail';
          $('#paddr').textContent = '解析失败：' + e.message;
          toast('解析失败');
        }
      };
    });

    // 磁力熊：探测播放地址
    if(detailData.playPageUrl){
      probePlayUrl(detailData.playPageUrl);
    }

  }catch(e){
    console.error(e);
    if(!detailOpen) return;
    $('#dBody').innerHTML = '<div class="empty" style="padding:30px 0">' +
      '<p>加载失败：' + escapeHtml(e.message || '未知错误') + '</p></div>';
  }
}

async function probePlayUrl(playPageUrl){
  const paddr = $('#paddrProbe');
  const playBtns = $('#playBtns');
  if(!paddr || !playBtns) return;

  let finalUrl = playPageUrl;
  let detected = false;

  try{
    const html = await requestUrl(playPageUrl);
    const v = extractVideoUrl(html);
    if(v){ finalUrl = v; detected = true; }
  }catch(e){
    console.warn('探测失败：', e.message);
  }

  if(!detailOpen) return;

  if(detected){
    paddr.className = 'paddr ok';
    paddr.textContent = finalUrl;
    toast('已探测到播放地址');
  }else{
    paddr.className = 'paddr fail';
    paddr.textContent = '未探测到 m3u8/mp4，使用原始地址：' + finalUrl;
  }

  playBtns.style.display = 'flex';

  const copyBtn = playBtns.querySelector('.btn-play-copy');
  const openBtn = playBtns.querySelector('.btn-play-open');

  if(copyBtn){
    copyBtn.onclick = async function(){
      const ok = await copyText(finalUrl);
      if(ok){ copyFeedback(copyBtn, '已复制 ✓'); toast('播放地址已复制'); }
      else toast('复制失败');
    };
  }

  if(openBtn){
    openBtn.onclick = function(){
      $('#playerBox').style.display = 'block';
      $('#paddr').textContent = finalUrl;
      startHlsPlayer(finalUrl);
      $('#dBody').scrollTo({ top:0, behavior:'smooth' });
    };
  }
}
