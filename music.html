<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聚合音乐</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f7f8fa;
    padding: 12px 12px 150px;
    padding-bottom: calc(150px + env(safe-area-inset-bottom));
    color: #222;
  }
  h2 { margin: 4px 0 12px; font-size: 20px; }

  .bar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
  .bar input { flex: 1; min-width: 0; padding: 10px 12px; font-size: 15px; border: 1px solid #d5d8dd; border-radius: 10px; background: #fff; outline: none; }
  .bar input:focus { border-color: #1db954; }
  .bar button { padding: 10px 18px; font-size: 15px; border: none; border-radius: 10px; background: #1db954; color: #fff; font-weight: 600; flex-shrink: 0; }
  .bar button:active { background: #17a447; }
  .bar button:disabled { background: #a8dfb9; }
  .bar .fav-btn { background: #f5a623; padding: 10px 12px; }
  .bar .fav-btn:active { background: #d98f15; }

  .bar .back-btn {
    display: none;
    width: 40px;
    height: 40px;
    padding: 0;
    border-radius: 10px;
    background: #e53935;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .bar .back-btn:active { background: #c62828; }
  .bar.in-search .back-btn { display: flex; }

  /* ============ 主页（收藏列表，一行两个） ============ */
#home-view {
  display: none;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  align-items: start;
}
  #home-view .home-item {
    position: relative;
    border-radius: 8px;
    background: #f7f8fa;
    padding: 10px 12px;
    margin-bottom: 0;
    cursor: pointer;
    word-break: break-word;
    overflow-wrap: anywhere;
    border: 1.5px solid transparent;
    transition: border-color .15s, background .15s;
  }
  #home-view .home-item:active { background: #eef9f1; }
  #home-view .home-item.playing-item {
    border-color: #1db954;
    background: #eef9f1;
  }
  #home-view .home-item .name {
    font-weight: 600;
    font-size: 13px;
    line-height: 1.35;
    color: #222;
    margin-bottom: 4px;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  #home-view .home-item .artist {
    font-size: 11px;
    color: #888;
    line-height: 1.3;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  #home-view .home-item .offline-tag { font-size: 11px; color: #1db954; margin-left: 4px; }
  #home-view .empty {
    grid-column: 1 / -1;
    text-align: center;
    color: #999;
    padding: 24px 6px;
    font-size: 12px;
    background: #fff;
    border-radius: 8px;
  }

  /* ============ 搜索页 ============ */
  #search-view { display: none; }
  #search-view.active { display: block; }
  #home-view.active { display: grid; }

  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: start; }
  .col { min-width: 0; }
  .col-title { font-size: 13px; font-weight: 700; padding: 2px 2px 8px; }
  .col-title.tz { color: #e53935; }
  .col-title.in { color: #1e6fff; }

  .song { border-radius: 8px; margin-bottom: 8px; border: 1.5px solid transparent; word-break: break-word; overflow-wrap: anywhere; cursor: pointer; position: relative; transition: border-color .15s, background .15s; }
  .song.tz { background: #ffd9d9; padding: 8px 34px 8px 18px; }
  .song.tz:active { background: #ffc4c4; }
  .song.tz.playing { border-color: #e53935; background: #ffc4c4; }
  .song.in { background: #d6e6ff; padding: 8px 34px 8px 10px; }
  .song.in:active { background: #bfd9ff; }
  .song.in.playing { border-color: #1e6fff; background: #bfd9ff; }

  .song .fav-toggle {
    position: absolute;
    top: 2px;
    right: 2px;
    font-size: 22px;
    color: #f5a623;
    opacity: .35;
    transition: opacity .15s;
    user-select: none;
    z-index: 2;
    padding: 2px 6px;
    line-height: 1;
    min-width: 32px;
    min-height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .song .fav-toggle.active { opacity: 1; }

  .song .offline-badge { position: absolute; top: 4px; font-size: 12px; display: none; z-index: 2; left: 4px; }
  .song.offline .offline-badge { display: inline; }
  .song.offline .offline-badge::after { content: '📥'; }

  .song .name { font-weight: 600; font-size: 13px; line-height: 1.35; color: #222; margin-bottom: 4px; word-break: break-word; overflow-wrap: anywhere; }
  .song .artist { font-size: 11px; color: #555; line-height: 1.4; word-break: break-word; overflow-wrap: anywhere; }
  .song .album { font-size: 11px; color: #777; line-height: 1.4; margin-top: 2px; word-break: break-word; overflow-wrap: anywhere; }

  .more { grid-column: 1 / -1; text-align: center; padding: 12px; color: #1db954; font-weight: 600; font-size: 14px; background: #fff; border-radius: 10px; margin-top: 4px; cursor: pointer; user-select: none; }
  .more:active { background: #eef9f1; }
  .more.loading { color: #999; cursor: default; }
  .more.nomore { color: #bbb; cursor: default; }

  .empty { text-align: center; color: #999; padding: 24px 6px; font-size: 12px; background: #fff; border-radius: 8px; }

  .fav-panel { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 300; display: none; align-items: flex-end; }
  .fav-panel.open { display: flex; }
  .fav-inner {
    background: #fff;
    width: 100%;
    max-height: 75vh;
    padding: 12px 12px 20px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .fav-inner.dragging-active {
    overflow: hidden;
    touch-action: none;
  }
  .fav-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 16px; padding-bottom: 10px; border-bottom: 1px solid #eee; margin-bottom: 10px; position: sticky; top: 0; background: #fff; z-index: 3; }
  .fav-header .fav-title { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .fav-header .sort-btn,
  .fav-header .export-btn,
  .fav-header .import-btn,
  .fav-header .dir-btn,
  .fav-header .clear-btn {
    background: #eef1f4;
    border: none;
    font-size: 12px;
    font-weight: 600;
    color: #444;
    padding: 5px 9px;
    border-radius: 8px;
    cursor: pointer;
  }
  .fav-header .sort-btn.active { background: #1db954; color: #fff; }
  .fav-header .export-btn { background: #1e6fff; color: #fff; }
  .fav-header .import-btn { background: #9c27b0; color: #fff; }
  .fav-header .dir-btn { background: #ff9800; color: #fff; }
  .fav-header .dir-btn.connected { background: #4caf50; }
  .fav-header .clear-btn { background: #e53935; color: #fff; }
  .fav-header .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #888; line-height: 1; padding: 0 4px; }

  .fav-item {
    position: relative;
    margin-bottom: 6px;
    border-radius: 8px;
    overflow: hidden;
    background: #e53935;
    touch-action: pan-y;
  }
  .fav-item .swipe-content {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    background: #f7f8fa;
    transition: transform .2s ease;
    will-change: transform;
    border-radius: 8px;
  }
  .fav-item.swiped .swipe-content { transform: translateX(-72px); }
  .fav-item .del-btn {
    position: absolute;
    top: 0; right: 0;
    width: 72px;
    height: 100%;
    background: #e53935;
    color: #fff;
    border: none;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .fav-item .info { flex: 1; min-width: 0; cursor: pointer; }
  .fav-item .name { font-weight: 600; font-size: 13px; word-break: break-word; overflow-wrap: anywhere; }
  .fav-item .artist { font-size: 11px; color: #888; margin-top: 3px; word-break: break-word; overflow-wrap: anywhere; }
  .fav-item .offline-tag { font-size: 11px; color: #1db954; margin-left: 4px; }

  .fav-item .drag-handle {
    display: none;
    font-size: 20px;
    color: #bbb;
    padding: 4px 8px;
    cursor: grab;
    user-select: none;
    flex-shrink: 0;
    touch-action: none;
    -webkit-user-select: none;
  }
  .fav-item .drag-handle:active { cursor: grabbing; }

  .fav-item .dl-btn {
    background: #ff9800;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .fav-item .dl-btn:active { background: #e88a00; }

  .fav-inner.sorting .fav-item .dl-btn { display: none; }
  .fav-inner.sorting .fav-item .drag-handle { display: flex; }
  .fav-inner.sorting .fav-item .del-btn { display: none; }
  .fav-inner.sorting .fav-item { background: transparent; }
  .fav-inner.sorting .fav-item .swipe-content { transform: none !important; }

  .fav-item.playing-item .swipe-content {
    border: 1.5px solid #1db954;
    background: #eef9f1;
    border-radius: 8px;
  }

  .fav-item.dragging {
    opacity: .95;
    z-index: 10;
    pointer-events: none;
  }
  .fav-item.dragging .swipe-content {
    background: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
    transform: scale(1.02);
  }

  /* ============ 播放器 ============ */
  .player {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #fff;
    border-top: 1px solid #eee;
    box-shadow: 0 -2px 12px rgba(0,0,0,.08);
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .progress-wrap {
    padding: 6px 14px 0;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #999;
  }
  .progress-wrap .time { flex-shrink: 0; min-width: 32px; text-align: center; }
  .progress-bar {
    flex: 1;
    height: 28px;
    position: relative;
    cursor: pointer;
    touch-action: none;
    display: flex;
    align-items: center;
  }
  .progress-bar::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 4px;
    background: #e6e8ec;
    border-radius: 2px;
    transform: translateY(-50%);
  }
  .progress-bar .fill {
    position: absolute;
    left: 0; top: 50%;
    height: 4px;
    width: 0%;
    background: #1db954;
    border-radius: 2px;
    transform: translateY(-50%);
    pointer-events: none;
  }
  .progress-bar .dot {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 14px;
    height: 14px;
    background: #1db954;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
    pointer-events: none;
    z-index: 2;
  }

  .player-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px 12px;
  }
  .player-info { flex: 1; min-width: 0; }
  .player-info .title-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .player-info .title-row .title {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    max-height: calc(1.3em * 2);
    overflow: hidden;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .player-info .sub { font-size: 11px; color: #888; line-height: 1.3; max-height: calc(1.3em * 1); overflow: hidden; margin-top: 2px; word-break: break-word; overflow-wrap: anywhere; }
  .player-controls { display: flex; align-items: center; gap: 4px; flex-shrink: 0; margin-left: auto; }
  .ctrl-btn { width: 38px; height: 38px; border: none; background: transparent; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #333; padding: 0; }
  .ctrl-btn:active { background: #f0f2f5; }
  .ctrl-btn.play { width: 44px; height: 44px; background: #1db954; color: #fff; box-shadow: 0 2px 6px rgba(29,185,84,.35); }
  .ctrl-btn.play:active { background: #17a447; }
  .ctrl-btn svg { display: block; }

  .dl-current-btn {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: #ff9800;
    color: #fff;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
  }
  .dl-current-btn:active { background: #e88a00; }
  .dl-current-btn:disabled { background: #ccc; cursor: default; }
  .dl-current-btn.done { background: #1db954; }
  .dl-current-btn.done, .dl-current-btn.failed { font-size: 0; }
  .dl-current-btn.done::after { content: '📥'; font-size: 12px; }
  .dl-current-btn.failed { background: #e53935; }
  .dl-current-btn.failed::after { content: '❌'; font-size: 12px; }

  .play-mode-btn {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: #eef1f4;
    color: #555;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
  }
  .play-mode-btn:active { background: #dfe3e8; }
  .play-mode-btn.random { background: #1db954; color: #fff; }

  .toast {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.8);
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 500;
    display: none;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { display: block; }

  @media (max-width: 340px) {
    .song .name { font-size: 12px; }
    .song .artist, .song .album { font-size: 10px; }
    .ctrl-btn { width: 34px; height: 34px; }
    .ctrl-btn.play { width: 40px; height: 40px; }
    .song .fav-toggle { font-size: 20px; min-width: 30px; min-height: 30px; }
    #home-view .home-item .name { font-size: 12px; }
  }
</style>
</head>
<body>

<h2>聚合音乐</h2>

<div class="bar" id="top-bar">
  <button class="back-btn" id="btn-back" onclick="goHome()" title="返回收藏列表">←</button>
  <input id="kw" placeholder="输入歌名，如：南山雪" autocomplete="off">
  <button id="btn-search" onclick="doSearch()">搜索</button>
  <button class="fav-btn" onclick="openFavorites()">⭐ <span id="fav-count">0</span></button>
</div>

<div id="home-view" class="active">
  <div class="empty">还没有收藏，去搜索页收藏歌曲</div>
</div>

<div id="search-view">
  <div class="columns">
    <div class="col">
      <div class="col-title tz">网易云</div>
      <div id="list-tz">
        <div class="empty">输入歌名后点搜索</div>
      </div>
    </div>
    <div class="col">
      <div class="col-title in">IN音乐</div>
      <div id="list-in">
        <div class="empty">输入歌名后点搜索</div>
      </div>
    </div>
  </div>
</div>

<div class="fav-panel" id="fav-panel">
  <div class="fav-inner" id="fav-inner">
    <div class="fav-header">
      <span class="fav-title">
        ⭐ 我的收藏
        <button class="import-btn" onclick="importFavoritesJson()">导入收藏</button>
        <button class="export-btn" onclick="exportFavJson()">导出收藏</button>
        <button class="dir-btn" id="btn-dir" onclick="scanMusicDir()">扫描目录</button>
        <button class="clear-btn" onclick="clearCache()">清缓存</button>
        <button class="sort-btn" id="btn-sort" onclick="toggleSortMode()">排序</button>
      </span>
      <button class="close-btn" onclick="closeFavorites()">×</button>
    </div>
    <div id="fav-list"></div>
  </div>
</div>

<div class="player" id="player" style="display:none">
  <div class="progress-wrap">
    <span class="time" id="t-cur">0:00</span>
    <div class="progress-bar" id="progress">
      <div class="fill" id="progress-fill"></div>
      <div class="dot" id="progress-dot"></div>
    </div>
    <span class="time" id="t-dur">0:00</span>
  </div>
  <div class="player-row">
    <div class="player-info">
      <div class="title-row">
        <button class="dl-current-btn" id="btn-dl-current" title="下载到音乐目录" onclick="downloadCurrent()">⬇</button>
        <div class="title" id="p-title"></div>
        <button class="play-mode-btn" id="btn-play-mode" title="顺序播放" onclick="togglePlayMode()">🔁</button>
      </div>
      <div class="sub" id="p-sub"></div>
    </div>
    <div class="player-controls">
      <button class="ctrl-btn" id="btn-prev" title="上一曲">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/>
        </svg>
      </button>
      <button class="ctrl-btn play" id="btn-play" title="播放/暂停">
        <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none">
          <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
        </svg>
      </button>
      <button class="ctrl-btn" id="btn-next" title="下一曲">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fav-json-input" accept=".json,application/json" style="display:none">
<audio id="audio"></audio>

<script>
// ============ 配置 ============
const TONZHON_API = 'https://tonzhon.com/api.php';
const PROXY = '/proxy?url=';
const MIN_DURATION = 60;
const FAV_KEY = 'music_favorites_v1';
const FAILED_KEY = 'music_failed_downloads_v1';
const MIN_FILE_SIZE = 512;
const CACHE_FETCH_TIMEOUT = 60000;

let tzList = [];
let inList = [];
let tzPage = 0, inPage = 0;
let tzMore = true, inMore = true;
let keyword = '';
let searching = false;
let loadingMore = false;
let playingIdx = null;
let favPlayingIdx = null;
let playToken = 0;
let dlBtnToken = 0;
let dlBtnLastKey = '';
let playMode = 'order';
let generation = 0;
let sortMode = false;

let favScrollTop = 0;
let currentView = 'home';

let musicDirHandle = null;
let pendingDirHandle = null;
let activeDownload = null;
let failedDownloads = new Set();

const inmp3UrlCache = new Map();

const audio = document.getElementById('audio');
const playerEl = document.getElementById('player');
const btnSearch = document.getElementById('btn-search');
const toastEl = document.getElementById('toast');

const songCache = new Map();
const songPending = new Map();

let currentPlayingSong = null;
let currentPlayingUrl = '';
let currentBlobUrl = null;

// ============ Toast ============
let toastTimer = null;
function showToast(msg, ms = 2000) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
}

// ============ 失败标记 ============
function loadFailed() {
  try {
    const arr = JSON.parse(localStorage.getItem(FAILED_KEY) || '[]');
    failedDownloads = new Set(Array.isArray(arr) ? arr : []);
  } catch (e) { failedDownloads = new Set(); }
}
function saveFailed() {
  try { localStorage.setItem(FAILED_KEY, JSON.stringify([...failedDownloads])); } catch (e) {}
}
function markFailed(fileName) { failedDownloads.add(fileName); saveFailed(); }
function unmarkFailed(fileName) { if (failedDownloads.delete(fileName)) saveFailed(); }
function isFailed(fileName) { return failedDownloads.has(fileName); }

// ============ 文件名 ============
function buildLocalFileName(f) {
  let id = '';
  if (f.source === 'tonzhon' && f.id) id = String(f.id);
  else if (f.source === 'inmp3' && f.rid) id = 'inmp3-' + f.rid;
  const name = (f.name || '').replace(/[\/\\:*?"<>|]/g, '').replace(/\s+/g, ' ').trim();
  const artist = (f.artist || '').replace(/[\/\\:*?"<>|]/g, '').replace(/\s+/g, ' ').trim();
  if (artist && name && artist !== name) return `${id}_${artist} - ${name}.mp3`;
  if (name) return `${id}_${name}.mp3`;
  return `${id}.mp3`;
}

// ============ 音频头检查 ============
async function looksLikeAudio(blob) {
  if (!blob || blob.size < MIN_FILE_SIZE) return false;
  try {
    const head = new Uint8Array(await blob.slice(0, 16).arrayBuffer());
    if (head[0] === 0xFF && (head[1] & 0xE0) === 0xE0) return true;
    if (head[0] === 0x49 && head[1] === 0x44 && head[2] === 0x33) return true;
    if (head[4] === 0x66 && head[5] === 0x74 && head[6] === 0x79 && head[7] === 0x70) return true;
    if (head[0] === 0x4F && head[1] === 0x67 && head[2] === 0x67 && head[3] === 0x53) return true;
    if (head[0] === 0x52 && head[1] === 0x49 && head[2] === 0x46 && head[3] === 0x46) return true;
    if (head[0] === 0x66 && head[1] === 0x4C && head[2] === 0x61 && head[3] === 0x43) return true;
    if (head[0] === 0xFF && (head[1] === 0xF1 || head[1] === 0xF9)) return true;
  } catch (e) {}
  return false;
}

// ============ 媒体会话（系统卡片同步核心） ============
function initMediaSession() {
  if (!('mediaSession' in navigator)) {
    console.warn('当前浏览器不支持 Media Session API');
    return;
  }

  // 监听系统卡片的上一曲/下一曲
  navigator.mediaSession.setActionHandler('previoustrack', () => {
    console.log('📻 系统触发上一曲');
    playPrev();
  });
  navigator.mediaSession.setActionHandler('nexttrack', () => {
    console.log('📻 系统触发下一曲');
    playNext();
  });

  // 监听系统播放/暂停（可选，确保状态同步）
  navigator.mediaSession.setActionHandler('play', () => {
    if (audio.src) audio.play().catch(() => {});
  });
  navigator.mediaSession.setActionHandler('pause', () => {
    audio.pause();
  });
}

// 更新系统卡片上的歌曲信息
function updateMediaSessionMetadata(song) {
  if (!('mediaSession' in navigator) || !song) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.name || '未知歌曲',
      artist: song.artist || '未知歌手',
      album: song.album || '',
      artwork: [
        // 这里可以放置专辑封面，没有的话系统会自动显示默认图标
        { src: 'https://via.placeholder.com/512', sizes: '512x512', type: 'image/png' }
      ]
    });
  } catch (e) {
    console.warn('设置媒体信息失败', e);
  }
}

// 更新系统卡片的播放状态
function updateMediaSessionState(state) {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.playbackState = state; // 'none' | 'paused' | 'playing'
  } catch (e) {}
}

// ============ 扫描目录 ============
async function scanMusicDir() {
  if (!('showDirectoryPicker' in window)) {
    alert('当前浏览器不支持目录选择（showDirectoryPicker）。\n\n请用 Android Chrome 122+ 或桌面版 Chrome/Edge。');
    return;
  }

  if (pendingDirHandle) {
    try {
      const p = await pendingDirHandle.requestPermission({ mode: 'readwrite' });
      if (p === 'granted') {
        musicDirHandle = pendingDirHandle;
        pendingDirHandle = null;
        saveDirHandle();
        updateDirBtnState();
        await rescanAndToast(musicDirHandle);
        return;
      } else {
        console.warn('用户拒绝授权，保留句柄待下次尝试');
        showToast('未授权。如不再弹窗，请去浏览器设置 -> 网站权限 -> 文件访问 中允许本网站。', 4000);
        updateDirBtnState();
        return;
      }
    } catch (e) {
      console.warn('恢复权限失败', e);
      showToast('恢复权限失败，请重试', 2500);
      updateDirBtnState();
      return;
    }
  }

  try {
    const h = await window.showDirectoryPicker({ mode: 'readwrite' });
    musicDirHandle = h;
    saveDirHandle();
    await saveDirHandleToIDB(h);
    updateDirBtnState();
    await rescanAndToast(h);
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    console.warn('选目录失败', e);
    showToast('扫描失败：' + (e && e.message ? e.message : e));
  }
}

async function rescanAndToast(h) {
  let total = 0, matched = 0;
  const favFileNames = new Set(favList.map(buildLocalFileName));
  try {
    for await (const entry of h.values()) {
      if (entry.kind !== 'file') continue;
      if (!entry.name.toLowerCase().endsWith('.mp3')) continue;
      total++;
      if (favFileNames.has(entry.name)) matched++;
    }
  } catch (e) { console.warn('列目录失败', e); }

  showToast(`目录「${h.name}」：${total} 个 mp3，匹配收藏 ${matched} 首`, 3500);
  await updateAllOfflineBadges();
  if (document.getElementById('fav-panel').classList.contains('open')) renderFavPanel();
  if (currentView === 'home') renderHomeView();
}

}

// ============ IndexedDB 存句柄 ============
function openHandleDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('music_app_db', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('handles')) {
        db.createObjectStore('handles');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveDirHandleToIDB(handle) {
  try {
    const db = await openHandleDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').put(handle, 'musicDir');
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
    console.log('💾 目录句柄已存 IndexedDB');
  } catch (e) {
    console.warn('存句柄失败', e);
  }
}

async function loadDirHandleFromIDB() {
  try {
    const db = await openHandleDB();
    const handle = await new Promise((resolve, reject) => {
      const tx = db.transaction('handles', 'readonly');
      const req = tx.objectStore('handles').get('musicDir');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return handle || null;
  } catch (e) {
    console.warn('取句柄失败', e);
    return null;
  }
}

function updateDirBtnState() {

// ============ 文件读写 ============
async function writeFileToDir(fileName, blob) {
  if (!musicDirHandle) return false;
  try {
    const fh = await musicDirHandle.getFileHandle(fileName, { create: true });
    const w = await fh.createWritable();
    await w.write(blob);
    await w.close();
    console.log('💾 已写入：', fileName, (blob.size/1024/1024).toFixed(2) + 'MB');
    return true;
  } catch (e) {
    console.warn('写入失败', fileName, e);
    return false;
  }
}

async function getFileFromDir(fileName) {
  if (!musicDirHandle) return null;
  try {
    const fh = await musicDirHandle.getFileHandle(fileName);
    const file = await fh.getFile();
    if (file.size >= MIN_FILE_SIZE) return file;
  } catch (e) {}
  return null;
}

async function deleteFileFromDir(fileName) {
  if (!musicDirHandle) return false;
  try {
    await musicDirHandle.removeEntry(fileName);
    console.log('🗑 已删除：', fileName);
    return true;
  } catch (e) {
    if (e && e.name === 'NotFoundError') return true;
    console.warn('删除失败', fileName, e);
    return false;
  }
}

async function resolveLocalFile(song) {
  if (!musicDirHandle) return null;
  const fileName = buildLocalFileName(song);
  const file = await getFileFromDir(fileName);
  if (file) {
    console.log('📂 命中本地：', fileName);
    return { file, fileName };
  }
  return null;
}

// ============ 在线 URL ============
async function resolveOnlineUrl(song) {
  if (song.source === 'tonzhon') {
    let url = song.playUrl;
    if (!url && song.id) url = `https://music.163.com/song/media/outer/url?id=${song.id}.mp3`;
    return url || '';
  }
  if (song.source === 'inmp3' && song.rid) {
    try {
      const data = await inmp3GetSongFresh(song.rid);
      return data.audioSrc || '';
    } catch (e) {
      return '';
    }
  }
  return '';
}

// ============ 下载 ============
async function downloadToCache(song, url, cardEl) {
  if (!musicDirHandle || !url) return false;

  const fileName = buildLocalFileName(song);

  const existing = await getFileFromDir(fileName);
  if (existing) {
    unmarkFailed(fileName);
    if (cardEl) {
      cardEl.classList.remove('downloading', 'failed');
      cardEl.classList.add('offline');
    }
    return true;
  }

  if (cardEl) {
    cardEl.classList.remove('offline', 'failed');
    cardEl.classList.add('downloading');
  }

  if (activeDownload) {
    try { activeDownload.abort(); } catch (e) {}
    activeDownload = null;
  }
  const controller = new AbortController();
  activeDownload = controller;

  try {
    let blob = null;

    try {
      const timer = setTimeout(() => controller.abort(), CACHE_FETCH_TIMEOUT);
      const resp = await fetch(url, { signal: controller.signal, redirect: 'follow' });
      clearTimeout(timer);
      if (resp.ok) {
        const ct = (resp.headers.get('content-type') || '').toLowerCase();
        if (!ct.includes('text/html') && !ct.includes('application/json')) {
          const b = await resp.blob();
          if (b && b.size >= MIN_FILE_SIZE && await looksLikeAudio(b)) {
            blob = b;
            console.log(`[direct] ✅ ${song.name} ${(b.size/1024).toFixed(0)}KB`);
          }
        }
      }
    } catch (e) {
      if (e.name === 'AbortError') { console.log('下载已取消', song.name); return false; }
      console.warn(`[direct] ❌ ${song.name}`, e.message || e);
    }

    if (!blob) {
      try {
        const timer = setTimeout(() => controller.abort(), CACHE_FETCH_TIMEOUT);
        const referer = song.source === 'inmp3' ? 'https://inmp3.com/' : 'https://music.163.com/';
        const resp = await fetch(PROXY + encodeURIComponent(url), {
          signal: controller.signal,
          headers: { 'x-target-referer': referer, 'x-target-accept': '*/*' },
          redirect: 'follow',
        });
        clearTimeout(timer);
        if (resp.ok) {
          const b = await resp.blob();
          if (b && b.size >= MIN_FILE_SIZE && await looksLikeAudio(b)) {
            blob = b;
            console.log(`[proxy] ✅ ${song.name} ${(b.size/1024).toFixed(0)}KB`);
          }
        }
      } catch (e) {
        if (e.name === 'AbortError') { console.log('下载已取消(proxy)', song.name); return false; }
        console.warn(`[proxy] ❌ ${song.name}`, e.message || e);
      }
    }

    if (!blob) {
      markFailed(fileName);
      if (cardEl) {
        cardEl.classList.remove('downloading');
        cardEl.classList.add('failed');
      }
      console.warn('❌ 下载失败并已标记：', fileName);
      return false;
    }

    const ok = await writeFileToDir(fileName, blob);
    if (cardEl) {
      cardEl.classList.remove('downloading');
      if (ok) {
        cardEl.classList.add('offline');
        unmarkFailed(fileName);
      } else {
        markFailed(fileName);
        cardEl.classList.add('failed');
      }
    } else if (ok) {
      unmarkFailed(fileName);
    } else {
      markFailed(fileName);
    }
    if (activeDownload === controller) activeDownload = null;
    return ok;
  } catch (e) {
    if (e.name !== 'AbortError') {
      console.warn('下载异常', song.name, e);
      markFailed(fileName);
    }
    if (cardEl) {
      cardEl.classList.remove('downloading');
      if (e.name !== 'AbortError') cardEl.classList.add('failed');
    }
    if (activeDownload === controller) activeDownload = null;
    return false;
  }
}

// ============ 下载当前播放的歌 ============
async function downloadCurrent() {
  const song = currentPlayingSong;
  if (!song) { showToast('没有正在播放的歌'); return; }
  if (!musicDirHandle) { showToast('请先扫描目录'); return; }

  const btn = document.getElementById('btn-dl-current');
  const fileName = buildLocalFileName(song);

  const existing = await getFileFromDir(fileName);
  if (existing) {
    btn.classList.add('done');
    btn.classList.remove('failed');
    showToast(`📥 已存在：${song.name}`, 2000);
    return;
  }

  unmarkFailed(fileName);
  btn.classList.remove('failed', 'done');

  btn.disabled = true;
  showToast(`⬇ 下载中：${song.name}`, 2000);

  let url = currentPlayingUrl;
  if (!url) url = await resolveOnlineUrl(song);
  if (!url) {
    btn.disabled = false;
    btn.classList.add('failed');
    showToast('获取播放地址失败', 3000);
    return;
  }

  const ok = await downloadToCache(song, url, null);
  btn.disabled = false;
  if (ok) {
    btn.classList.add('done');
    btn.classList.remove('failed');
    showToast(`📥 已下载：${song.name}`, 2000);
    await updateAllOfflineBadges();
    if (document.getElementById('fav-panel').classList.contains('open')) renderFavPanel();
    if (currentView === 'home') renderHomeView();
  } else {
    btn.classList.add('failed');
    btn.classList.remove('done');
    showToast(`❌ 下载失败：${song.name}`, 3000);
  }
}

// ============ 下载按钮状态 ============
async function updateDlCurrentBtn() {
  const btn = document.getElementById('btn-dl-current');
  if (!btn) return;

  const song = currentPlayingSong;
  if (!song || !musicDirHandle) {
    btn.classList.remove('done', 'failed');
    dlBtnLastKey = '';
    btn.disabled = false;
    return;
  }

  const fileName = buildLocalFileName(song);
  dlBtnLastKey = fileName;

  const myToken = ++dlBtnToken;
  const myPlayToken = playToken;
  const myKey = fileName;

  if (isFailed(fileName)) {
    if (myToken !== dlBtnToken || dlBtnLastKey !== myKey) return;
    if (!btn.classList.contains('failed')) {
      btn.classList.remove('done');
      btn.classList.add('failed');
    }
    btn.disabled = false;
    return;
  }

  const existing = await getFileFromDir(fileName);
  if (myToken !== dlBtnToken || myPlayToken !== playToken || dlBtnLastKey !== myKey) return;

  if (existing) {
    if (!btn.classList.contains('done')) {
      btn.classList.remove('failed');
      btn.classList.add('done');
    }
  } else {
    if (btn.classList.contains('done') || btn.classList.contains('failed')) {
      btn.classList.remove('done', 'failed');
    }
  }
  btn.disabled = false;
}

function pickRandomNext(currentIndex, listLength) {
  if (listLength <= 1) return currentIndex;
  let next = currentIndex;
  while (next === currentIndex) {
    next = Math.floor(Math.random() * listLength);
  }
  return next;
}

// ============ 收藏 ============
function favKeyOf(s) {
  return `${s.source}:${s.id || s.rid}`;
}

let favList = [];
let favKeys = new Set();

function loadFavorites() {
  try {
    favList = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
    if (!Array.isArray(favList)) favList = [];
  } catch (e) { favList = []; }
  favKeys = new Set(favList.map(favKeyOf));
  updateFavCount();
}
function saveFavorites() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favList)); } catch (e) {}
  updateFavCount();
}
function updateFavCount() {
  const el = document.getElementById('fav-count');
  if (el) el.textContent = favList.length;
}

async function toggleFavorite(s) {
  const key = favKeyOf(s);
  if (favKeys.has(key)) {
    favList = favList.filter(f => favKeyOf(f) !== key);
    favKeys.delete(key);
    saveFavorites();
    refreshFavStars();
    const fileName = buildLocalFileName(s);
    await deleteFileFromDir(fileName);
    unmarkFailed(fileName);
    showToast(`🗑 已取消收藏：${s.name}`, 2000);
    if (document.getElementById('fav-panel').classList.contains('open')) renderFavPanel();
    if (currentView === 'home') renderHomeView();
    await markCardBadge(s);
    if (currentPlayingSong && favKeyOf(currentPlayingSong) === key) {
      dlBtnLastKey = '';
      updateDlCurrentBtn();
    }
  } else {
    favList.unshift({
      source: s.source, id: s.id, rid: s.rid,
      name: s.name, artist: s.artist, album: s.album,
      playUrl: s.playUrl || ''
    });
    favKeys.add(key);
    saveFavorites();
    refreshFavStars();
    showToast(`⭐ 已收藏：${s.name}`, 2000);
    if (document.getElementById('fav-panel').classList.contains('open')) renderFavPanel();
    if (currentView === 'home') renderHomeView();
    await markCardBadge(s);
  }
}

async function manualDownloadFavorite(index) {
  const f = favList[index];
  if (!f) return;

  const fileName = buildLocalFileName(f);

  const existing = await getFileFromDir(fileName);
  if (existing) {
    showToast(`📥 已存在：${f.name}`, 2000);
    renderFavPanel();
    return;
  }

  unmarkFailed(fileName);

  showToast(`⬇ 下载中：${f.name}`, 2000);
  const url = await resolveOnlineUrl(f);
  if (!url) { showToast('获取播放地址失败', 3000); return; }

  const ok = await downloadToCache(f, url, null);
  if (ok) showToast(`📥 已下载：${f.name}`, 2000);
  else showToast(`❌ 下载失败：${f.name}`, 3000);

  renderFavPanel();
  if (currentView === 'home') renderHomeView();
  await markCardBadge(f);
}

async function markCardBadge(song) {
  const fileName = buildLocalFileName(song);
  const key = favKeyOf(song);
  const existing = await getFileFromDir(fileName);
  document.querySelectorAll('.song').forEach(el => {
    if (el.dataset.favKey === key) {
      el.classList.toggle('offline', !!existing);
      el.classList.remove('failed', 'downloading');
    }
  });
}

function refreshFavStars() {
  document.querySelectorAll('.song').forEach(el => {
    const k = el.dataset.favKey;
    if (!k) return;
    const star = el.querySelector('.fav-toggle');
    if (star) star.classList.toggle('active', favKeys.has(k));
  });
}

function openFavorites() {
  document.getElementById('fav-panel').classList.add('open');
  renderFavPanel();
}
function closeFavorites() {
  const inner = document.getElementById('fav-inner');
  if (inner) favScrollTop = inner.scrollTop;
  document.getElementById('fav-panel').classList.remove('open');
}

    version: 1,
    exportedAt: new Date().toISOString(),

  };

  input.value = '';
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      let incoming = Array.isArray(data) ? data
                   : (data && Array.isArray(data.favorites) ? data.favorites : []);
      if (!incoming.length) { showToast('文件里没有收藏数据'); return; }

      const valid = incoming.filter(f =>
        f && f.source && f.name && (f.id || f.rid)
      ).map(f => ({
        source: f.source,
        id: f.id,
        rid: f.rid,
        name: f.name,
        artist: f.artist || '',
        album: f.album || '',
        playUrl: f.playUrl || ''
      }));
      if (!valid.length) { showToast('没有可导入的有效收藏'); return; }

      const existing = new Set(favList.map(favKeyOf));
      let added = 0, dup = 0;
      for (let i = valid.length - 1; i >= 0; i--) {
        const f = valid[i];
        const key = favKeyOf(f);
        if (existing.has(key)) { dup++; continue; }
        favList.unshift(f);
        existing.add(key);
        added++;
      }
      favKeys = new Set(favList.map(favKeyOf));
      saveFavorites();
      renderFavPanel();
      if (currentView === 'home') renderHomeView();
      refreshFavStars();
      showToast(`导入完成：新增 ${added} 首${dup ? `，重复 ${dup}` : ''}`, 3500);
      if (musicDirHandle) await updateAllOfflineBadges();
    } catch (e) {
      console.warn('导入收藏失败', e);
      showToast('导入失败：不是有效的 JSON 文件', 3000);
    } finally {
      input.value = '';
      input.onchange = null;
    }
  };
  input.click();
}

// ============ 清缓存 ============
async function clearCache() {
  if (!musicDirHandle) { showToast('请先扫描目录'); return; }

  const protectedNames = new Set(favList.map(f => buildLocalFileName(f)));

  const files = [];
  try {
    for await (const entry of musicDirHandle.values()) {
      if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.mp3')) {
        files.push(entry.name);
      }
    }
  } catch (e) { console.warn('列目录失败', e); }

  const toDelete = files.filter(name => !protectedNames.has(name));
  if (!toDelete.length) {
    showToast(protectedNames.size
      ? `没有可清缓存（收藏 ${protectedNames.size} 首已保留）`
      : '没有可清缓存');
    return;
  }

  const msg = protectedNames.size
    ? `确定清空目录里 ${toDelete.length} 首【非收藏】音频？\n\n（收藏 ${protectedNames.size} 首会保留；同时会清除下载失败标记）`
    : `确定清空目录里 ${toDelete.length} 首音频？\n\n（同时会清除下载失败标记）`;
  if (!confirm(msg)) return;

  let removed = 0;
  for (const name of toDelete) {
    if (await deleteFileFromDir(name)) removed++;
  }
  failedDownloads.clear();
  saveFailed();

  showToast(`已清空 ${removed} 首非收藏缓存${protectedNames.size ? `（保留 ${protectedNames.size} 首收藏）` : ''}`);
  await updateAllOfflineBadges();
  if (document.getElementById('fav-panel').classList.contains('open')) renderFavPanel();
  if (currentView === 'home') renderHomeView();
}

function attachTap(el, onTap) {
  let startX = 0, startY = 0, cancelled = false;
  el.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    startX = e.clientX; startY = e.clientY;
    cancelled = false;
  });
  el.addEventListener('pointermove', (e) => {
    if (cancelled) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) cancelled = true;
  });
  el.addEventListener('pointerup', () => {
    if (cancelled) { cancelled = false; return; }
    console.log('🖱 tap 触发');
    onTap();
  });
  el.addEventListener('pointercancel', () => { cancelled = true; });
}

function setupSwipe(wrap, content) {
  let startX = 0, startY = 0, deltaX = 0, dragging = false, decided = false;
  content.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    startX = e.clientX; startY = e.clientY;
    deltaX = 0; dragging = true; decided = false;
  });
  content.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!decided) {
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      if (Math.abs(dy) > Math.abs(dx)) { dragging = false; return; }
      decided = true;
      content.setPointerCapture?.(e.pointerId);
    }
    deltaX = Math.max(-72, Math.min(0, dx));
    content.style.transition = 'none';
    content.style.transform = `translateX(${deltaX}px)`;
    e.preventDefault();
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    if (!decided) return;
    content.style.transition = '';
    content.style.transform = '';
    const opened = deltaX < -36;
    wrap.classList.toggle('swiped', opened);
  };
  content.addEventListener('pointerup', end);
  content.addEventListener('pointercancel', end);
  content.addEventListener('pointerleave', () => { if (dragging) end(); });
}

function setupDrag(wrap, handle, index) {
  const favInner = document.getElementById('fav-inner');
  const listBox = document.getElementById('fav-list');
  handle.addEventListener('pointerdown', (e) => {
    e.stopPropagation(); e.preventDefault();
    const startY = e.clientY;
    let dragging = false;
    let currentIndex = index;
    const onMove = (ev) => {
      const dy = Math.abs(ev.clientY - startY);
      if (!dragging && dy > 6) {
        dragging = true;
        wrap.classList.add('dragging');
        favInner.classList.add('dragging-active');
      }
      if (!dragging) return;
      const innerRect = favInner.getBoundingClientRect();
      const edge = 60;
      let scrollDelta = 0;
      if (ev.clientY < innerRect.top + edge) scrollDelta = -12;
      else if (ev.clientY > innerRect.bottom - edge) scrollDelta = 12;
      if (scrollDelta) favInner.scrollTop += scrollDelta;
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const target = el && el.closest('.fav-item');
      if (!target || target === wrap) return;
      const targetIdx = parseInt(target.dataset.index, 10);
      if (isNaN(targetIdx) || targetIdx === currentIndex) return;
      const rect = target.getBoundingClientRect();
      const inTopHalf = ev.clientY < rect.top + rect.height / 2;
      const [moved] = favList.splice(currentIndex, 1);
      let insertAt = targetIdx;
      if (!inTopHalf) insertAt = targetIdx + 1;
      if (currentIndex < insertAt) insertAt--;
      favList.splice(insertAt, 0, moved);
      currentIndex = insertAt;
      if (inTopHalf) listBox.insertBefore(wrap, target);
      else listBox.insertBefore(wrap, target.nextSibling);
      Array.from(listBox.querySelectorAll('.fav-item')).forEach((el, i) => { el.dataset.index = i; });
    };
    const onUp = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      wrap.classList.remove('dragging');
      favInner.classList.remove('dragging-active');
      if (!dragging) return;

      if (favPlayingIdx && favList[favPlayingIdx.index]) {
        const playingKey = favKeyOf(favList[favPlayingIdx.index]);
        const newIdx = favList.findIndex(x => favKeyOf(x) === playingKey);
        if (newIdx >= 0) favPlayingIdx.index = newIdx;
      }

      const items = listBox.querySelectorAll('.fav-item');
      items.forEach((el, i) => { el.dataset.index = i; });

      saveFavorites();
    };
    document.addEventListener('pointermove', onMove, { passive: false });
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

// ============ 播放 ============
async function playLocalFile(file, myToken) {
  const blobUrl = URL.createObjectURL(file);
  if (currentBlobUrl) {
    const old = currentBlobUrl;
    setTimeout(() => { try { URL.revokeObjectURL(old); } catch (e) {} }, 500);
  }
  currentBlobUrl = blobUrl;
  audio.onloadedmetadata = null;
  audio.onerror = null;
  audio.removeAttribute('src');
  audio.src = blobUrl;
  return await new Promise((resolve) => {
    let settled = false;
    audio.onerror = () => {
      if (settled) return;
      settled = true;
      if (myToken !== playToken) { resolve(false); return; }
      try { URL.revokeObjectURL(blobUrl); } catch (e) {}
      if (currentBlobUrl === blobUrl) currentBlobUrl = null;
      audio.onerror = null;
      audio.removeAttribute('src');
      resolve(false);
    };
    audio.onloadedmetadata = () => {
      if (settled) return;
      settled = true;
      if (myToken !== playToken) { resolve(false); return; }
      audio.play()
        .then(() => { updatePlayIcon(true); resolve(true); })
        .catch((err) => { console.warn('本地播放失败', err); resolve(false); });
    };
  });
}

  currentPlayingUrl = '';
  updateDlCurrentBtn();

  audio.onloadedmetadata = null;
  audio.onerror = null;
  audio.removeAttribute('src');
  updatePlayIcon(false);

  const local = await resolveLocalFile(s);
  if (myToken !== playToken) return;
  if (local) {
    const ok = await playLocalFile(local.file, myToken);
    if (myToken !== playToken) return;
    if (ok) {
      if (cardEl) {
        cardEl.classList.remove('failed', 'downloading');
        cardEl.classList.add('offline');
      }
      currentPlayingUrl = '';
      updateDlCurrentBtn();
      return;
    }
  }

  document.getElementById('p-sub').textContent = '⏳ 获取播放地址...';
  let onlineUrl = '';
  if (source === 'tonzhon') {
    onlineUrl = s.playUrl;
  } else {
    try {
      const data = await inmp3GetSongFresh(s.rid);
      if (myToken !== playToken) return;
      onlineUrl = data.audioSrc || '';
    } catch (e) {
      if (myToken !== playToken) return;
      console.warn('获取播放地址失败', e);
      showToast('获取播放地址失败', 2000);
      return;
    }
  }
  if (!onlineUrl) { 
    console.warn('❌ 没有可播放地址', source, s);
    showToast('没有可播放地址', 2000); 
    return; 
  }
  console.log('🔗 播放地址：', onlineUrl);
  if (myToken !== playToken) return;

  currentPlayingSong = s;
  currentPlayingUrl = onlineUrl;
  updateDlCurrentBtn();
  document.getElementById('p-sub').textContent = s.artist + (s.album ? ' · ' + s.album : '');

  audio.src = onlineUrl;
  audio.onloadedmetadata = () => {
    if (myToken !== playToken) return;
    console.log('📊 loadedmetadata, duration =', audio.duration);
    if (source === 'tonzhon' && audio.duration && isFinite(audio.duration) && audio.duration < MIN_DURATION) {
      const idx = tzList.findIndex(x => x.id === s.id);
      if (idx >= 0) tzList.splice(idx, 1);
      playingIdx = null;
      renderColumn('list-tz', tzList, 'tonzhon');
      if (!tzList.length) { playerEl.style.display = 'none'; stopAudio(); return; }
      const nextIdx = idx < tzList.length ? idx : tzList.length - 1;
      play('tonzhon', nextIdx);
      return;
    }
    audio.play()
      .then(() => { console.log('▶️ 播放已启动'); updatePlayIcon(true); updateMediaSessionState('playing'); })
      .catch((err) => { console.warn('❌ 播放失败', err); showToast('这首歌播放不了：' + (err.message || ''), 2500); });
  };
  audio.onerror = () => {
    if (myToken !== playToken) return;
    if (audio.ended) return;
    console.warn('❌ audio 加载出错 code=', audio.error && audio.error.code);
    showToast('❌ 音频加载失败，可能版权受限', 2500);
  };
}

// ============ 代理 ============
async function proxyFetch(targetUrl, extraHeaders = {}) {
  const url = PROXY + encodeURIComponent(targetUrl);
  const headers = new Headers();
  for (const [k, v] of Object.entries(extraHeaders)) {
    const kl = k.toLowerCase();
    if (kl === 'referer') headers.set('x-target-referer', v);
    else if (kl === 'accept') headers.set('x-target-accept', v);
    else if (kl === 'cookie') headers.set('x-target-cookie', v);
    else headers.set(k, v);
  }
  const r = await fetch(url, { headers });
  if (!r.ok) throw new Error('代理 ' + r.status);
  return r.text();
}

// ============ JSONP / 搜索 ============
let cbSeq = 0;
function jsonp(params) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + (++cbSeq) + '_' + Date.now();
    window[cb] = (data) => { resolve(data); delete window[cb]; script.remove(); };
    params.callback = cb;
    const query = Object.keys(params)
      .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
    const script = document.createElement('script');
    script.src = TONZHON_API + '?' + query;
    script.onerror = () => { reject(new Error('网络错误')); delete window[cb]; script.remove(); };
    document.body.appendChild(script);
    setTimeout(() => reject(new Error('超时')), 10000);
  });
}

async function inmp3Search(kw, page = 1) {
  const target = `https://inmp3.com/so/${encodeURIComponent(kw)}/${page}/`;
  const html = await proxyFetch(target, { Referer: 'https://inmp3.com/', Accept: 'text/html,application/xhtml+xml' });
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const items = doc.querySelectorAll('.result-item');
  const out = [];
  items.forEach(el => {
    out.push({
      rid: el.getAttribute('data-rid'),
      title: el.querySelector('.result-title')?.textContent.trim() || '',
      artist: el.querySelector('.result-artist')?.textContent.trim() || '',
      album: (el.querySelector('.result-album')?.textContent || '').replace('专辑:', '').trim()
    });
  });
  const totalEl = doc.querySelector('#total-pages');
  const totalPages = totalEl ? parseInt(totalEl.textContent) : 1;
  return { list: out, totalPages };
}

async function inmp3GetSongFresh(rid) {
  if (inmp3UrlCache.has(rid)) {
    return { audioSrc: inmp3UrlCache.get(rid) };
  }
  try {
    const target = `https://inmp3.com/song/${rid}/`;
    const html = await proxyFetch(target, {
      Referer: 'https://inmp3.com/',
      Accept: 'text/html,application/xhtml+xml'
    });
    const m = html.match(/let\s+code\s*=\s*"([^"]*)"/);
    let audioSrc = '';
    if (m) { try { audioSrc = atob(m[1]); } catch (e) {} }
    if (audioSrc) inmp3UrlCache.set(rid, audioSrc);
    return { audioSrc };
  } catch (e) {
    return { audioSrc: '' };
  }
}

async function loadTonzhon(page) {
  try {
    const data = await jsonp({ types: 'search', count: 10, source: 'netease', pages: page, name: keyword });
    if (!data || !Array.isArray(data)) return [];
    return data
      .filter(s => !/铃声|片段|30秒|试听|伴奏/.test(s.name))

        album: s.album || '',
        playUrl: `https://music.163.com/song/media/outer/url?id=${s.id}.mp3`
      }));
  } catch (e) {
    console.warn('铜钟失败', e);
    return [];
  }
}

    return data.list.map(s => ({
      source: 'inmp3', rid: s.rid,
      name: s.title, artist: s.artist, album: s.album
    }));
  } catch (e) {
    console.warn('IN音乐失败', e);
    return [];
  }
}

// ============ 搜索/渲染 ============
function doSearch() {
  if (searching || loadingMore) return;
  const name = document.getElementById('kw').value.trim();
  if (!name) { alert('请输入歌名'); return; }

  showSearch();

  generation++;
  keyword = name;
  tzList = []; inList = [];
  tzPage = 0; inPage = 0;
  tzMore = true; inMore = true;
  songCache.clear();
  songPending.clear();

  playingIdx = null;
  favPlayingIdx = null;
  setNavDisabled(true, true);

  document.getElementById('list-tz').innerHTML = '<div class="empty">加载中...</div>';
  document.getElementById('list-in').innerHTML = '<div class="empty">加载中...</div>';
  document.querySelector('#search-view .columns').querySelectorAll('.more').forEach(x => x.remove());

  searching = true;
  btnSearch.disabled = true;
  btnSearch.textContent = '搜索中';

  let pending = 2;
  const done = () => {
    pending--;
    if (pending === 0) {
      searching = false;
      btnSearch.disabled = false;
      btnSearch.textContent = '搜索';
      updateMoreBtn();
    }
  };

  loadTonzhon(1).then(list => {
    tzList = list;
    tzPage = 1;
    if (list.length < 10) tzMore = false;
    renderColumn('list-tz', tzList, 'tonzhon');
    updateMoreBtn();
    done();
  }).catch(() => done());

  loadInmp3(1).then(list => {
    inList = list;
    inPage = 1;
    if (list.length < 10) inMore = false;
    renderColumn('list-in', inList, 'inmp3');
    updateMoreBtn();
    done();
  }).catch(() => done());
}

async function loadMore() {
  if (searching || loadingMore) return;
  if (!tzMore && !inMore) return;
  loadingMore = true;
  updateMoreBtn();

  const tasks = [];
  if (tzMore) {
    tasks.push(loadTonzhon(tzPage + 1).then(arr => {
      if (arr.length) {
        tzPage++;
        tzList = tzList.concat(arr);
        renderColumn('list-tz', tzList, 'tonzhon');
      }
    }).catch(() => {}));
  }
  if (inMore) {
    tasks.push(loadInmp3(inPage + 1).then(arr => {
      if (arr.length) {
        inPage++;
        inList = inList.concat(arr);
        renderColumn('list-in', inList, 'inmp3');
      }
    }).catch(() => {}));
  }

  await Promise.all(tasks);
  loadingMore = false;
  updateMoreBtn();
}

function renderColumn(id, arr, source) {
  const box = document.getElementById(id);
  box.innerHTML = '';
  if (!arr.length) {
    box.innerHTML = '<div class="empty">暂无结果</div>';
    return;
  }
  const cls = source === 'tonzhon' ? 'tz' : 'in';
  arr.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'song ' + cls;
    div.dataset.favKey = favKeyOf(s);
    if (source === 'inmp3') div.dataset.rid = s.rid;

    if (playingIdx && playingIdx.source === source && playingIdx.index === i) {
      div.classList.add('playing');
    }

    const active = favKeys.has(favKeyOf(s)) ? 'active' : '';
    div.innerHTML = `
      <span class="offline-badge"></span>
      <span class="fav-toggle ${active}" title="收藏/取消">★</span>
      <div class="name">${escapeHtml(s.name)}</div>
      <div class="artist">${escapeHtml(s.artist)}</div>
      ${s.album ? `<div class="album">${escapeHtml(s.album)}</div>` : ''}
    `;

    const star = div.querySelector('.fav-toggle');
    star.addEventListener('pointerdown', (e) => e.stopPropagation());
    star.addEventListener('pointerup', (e) => {
      e.stopPropagation();
      toggleFavorite(s);
    });

    attachTap(div, () => play(source, i));
    box.appendChild(div);
  });
  updateAllOfflineBadges();
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function updateMoreBtn() {
  const box = document.querySelector('#search-view .columns');
  box.querySelectorAll('.more').forEach(x => x.remove());
  if (loadingMore) {
    const m = document.createElement('div');
    m.className = 'more loading';
    m.textContent = '加载中...';
    box.appendChild(m);
  } else if (tzMore || inMore) {
    const m = document.createElement('div');
    m.className = 'more';
    m.textContent = '加载更多...';
    m.onclick = loadMore;
    box.appendChild(m);
  } else if (tzList.length || inList.length) {
    const m = document.createElement('div');
    m.className = 'more nomore';
    m.textContent = '没有更多了';
    box.appendChild(m);
  }
}

function playPrev() {
  if (favPlayingIdx) {
    const i = favPlayingIdx.index;
    if (i <= 0) return;
    playFavorite(i - 1);
    return;
  }
  if (!playingIdx) return;
  const { source, index } = playingIdx;
  if (index <= 0) return;
  play(source, index - 1);
}
function playNext() {
  if (favPlayingIdx) {
    const i = favPlayingIdx.index;
    if (i >= favList.length - 1) return;
    playFavorite(i + 1);
    return;
  }
  if (!playingIdx) return;
  const { source, index } = playingIdx;
  const list = source === 'tonzhon' ? tzList : inList;
  if (index >= list.length - 1) return;
  play(source, index + 1);
}

function updateNavButtonsByList() {
  if (!playingIdx) { setNavDisabled(true, true); return; }
  const { source, index } = playingIdx;
  const list = source === 'tonzhon' ? tzList : inList;
  const hasPrev = index > 0;
  const hasNext = index < list.length - 1;
  setNavDisabled(!hasPrev, !hasNext);
}

const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const btnPlay = document.getElementById('btn-play');
const iconPlay = document.getElementById('icon-play');
const iconPause = document.getElementById('icon-pause');

function setNavDisabled(prevDisabled, nextDisabled) {
  btnPrev.disabled = prevDisabled;
  btnNext.disabled = nextDisabled;
  btnPrev.style.opacity = prevDisabled ? '0.35' : '1';
  btnNext.style.opacity = nextDisabled ? '0.35' : '1';
  btnPrev.style.pointerEvents = prevDisabled ? 'none' : '';
  btnNext.style.pointerEvents = nextDisabled ? 'none' : '';
}

btnPrev.onclick = playPrev;
btnNext.onclick = playNext;
btnPlay.onclick = () => {
  if (!audio.src) return;
  if (audio.paused) audio.play().catch(() => {});
  else audio.pause();
};

function updatePlayIcon(isPlaying) {
  iconPlay.style.display = isPlaying ? 'none' : 'block';
  iconPause.style.display = isPlaying ? 'block' : 'none';
}

const progressBar = document.getElementById('progress');
const progressFill = document.getElementById('progress-fill');
const progressDot = document.getElementById('progress-dot');
const tCur = document.getElementById('t-cur');
const tDur = document.getElementById('t-dur');

function fmt(sec) {
  if (!sec || isNaN(sec) || sec < 0 || !isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function setProgress(cur, dur) {
  const pct = (dur > 0 && isFinite(dur)) ? Math.min(100, (cur / dur) * 100) : 0;
  progressFill.style.width = pct + '%';
  progressDot.style.left = pct + '%';
  tCur.textContent = fmt(cur);
  tDur.textContent = fmt(dur);
}

// ★ 简化：直接监听，不做 token 拦截
audio.addEventListener('timeupdate', () => {
  setProgress(audio.currentTime, audio.duration || 0);
});
audio.addEventListener('loadedmetadata', () => {
  setProgress(0, audio.duration || 0);
});
audio.addEventListener('play', () => {
  updatePlayIcon(true);
  updateMediaSessionState('playing');
});
audio.addEventListener('pause', () => {
  updatePlayIcon(false);
  updateMediaSessionState('paused');
});

audio.addEventListener('ended', () => {
  updatePlayIcon(false);
  updateMediaSessionState('paused');
  audio.onerror = null;

  if (favPlayingIdx) {
    const i = favPlayingIdx.index;
    const total = favList.length;
    if (total <= 0) return;

    if (playMode === 'random') {
      if (total === 1) { playFavorite(0); return; }
      const next = pickRandomNext(i, total);
      playFavorite(next);
    } else {
      if (i < total - 1) playFavorite(i + 1);
    }
    return;
  }

  if (!playingIdx) return;
  const { source, index } = playingIdx;
  const list = source === 'tonzhon' ? tzList : inList;
  const total = list.length;

  if (playMode === 'random') {
    if (total === 1) { play(source, 0); return; }
    const next = pickRandomNext(index, total);
    play(source, next);
  } else {
    if (index < total - 1) playNext();
  }
});

// ============ 进度条拖动 ============
let progressDrag = null;

function getBarRect() {
  return progressBar.getBoundingClientRect();
}
function timeFromClientX(clientX) {
  const rect = getBarRect();
  const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  return pct * (audio.duration || 0);
}
function isOnDot(clientX, clientY) {
  const rect = getBarRect();
  const pct = audio.duration ? (audio.currentTime / audio.duration) : 0;
  const dotX = rect.left + pct * rect.width;
  const dotY = rect.top + rect.height / 2;
  const dx = Math.abs(clientX - dotX);
  const dy = Math.abs(clientY - dotY);
  return dx <= 12 && dy <= 16;
}

progressBar.addEventListener('pointerdown', (e) => {
  if (!audio.duration) return;
  progressBar.setPointerCapture?.(e.pointerId);
  e.preventDefault();

  if (isOnDot(e.clientX, e.clientY)) {
    progressDrag = { mode: 'dot' };
    audio.currentTime = timeFromClientX(e.clientX);
    setProgress(audio.currentTime, audio.duration);
  } else {
    progressDrag = {
      mode: 'bar',
      startX: e.clientX,
      startTime: audio.currentTime,
    };
  }
});

progressBar.addEventListener('pointermove', (e) => {
  if (!progressDrag) return;
  e.preventDefault();

  if (progressDrag.mode === 'dot') {
    audio.currentTime = timeFromClientX(e.clientX);
    setProgress(audio.currentTime, audio.duration);
  } else if (progressDrag.mode === 'bar') {
    const rect = getBarRect();
    const dx = e.clientX - progressDrag.startX;
    const pctDelta = dx / rect.width;
    const timeDelta = pctDelta * audio.duration;
    let newTime = progressDrag.startTime + timeDelta;
    newTime = Math.max(0, Math.min(audio.duration, newTime));
    audio.currentTime = newTime;
    setProgress(newTime, audio.duration);
  }
});

const endProgressDrag = (e) => {
  if (!progressDrag) return;
  progressDrag = null;
  try { progressBar.releasePointerCapture?.(e.pointerId); } catch (err) {}
};
progressBar.addEventListener('pointerup', endProgressDrag);
progressBar.addEventListener('pointercancel', endProgressDrag);

document.getElementById('kw').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

// ============ 启动 ============
async function boot() {
  loadFavorites();
  loadFailed();
  setNavDisabled(true, true);

  // ★ 初始化媒体会话
  initMediaSession();

  try {
    const savedMode = localStorage.getItem('music_play_mode');
    if (savedMode === 'random' || savedMode === 'order') playMode = savedMode;
  } catch (e) {}
  updatePlayModeBtn();

  document.getElementById('fav-panel').addEventListener('click', (e) => {
    if (e.target.id === 'fav-panel') {
      closeFavorites();
    }
  });

  const savedHandle = await loadDirHandleFromIDB();
  if (savedHandle) {
    let perm = 'prompt';
    try {
      perm = await savedHandle.queryPermission({ mode: 'readwrite' });
    } catch (e) {
      console.warn('查询权限失败', e);
    }

    if (perm === 'granted') {
      musicDirHandle = savedHandle;
      console.log('✅ 目录句柄已自动恢复：', savedHandle.name);
      updateDirBtnState();
      updateAllOfflineBadges();
    } else {
      console.log('⏳ 权限未授予，尝试自动请求权限...');
      
      setTimeout(async () => {
        try {
          const reqPerm = await savedHandle.requestPermission({ mode: 'readwrite' });
          if (reqPerm === 'granted') {
            musicDirHandle = savedHandle;
            pendingDirHandle = null;
            console.log('✅ 权限已自动获取：', savedHandle.name);
            updateDirBtnState();
            updateAllOfflineBadges();
            renderHomeView();
            if (document.getElementById('fav-panel').classList.contains('open')) renderFavPanel();
          } else {
            pendingDirHandle = savedHandle;
            console.log('❌ 用户拒绝授权，保持待授权状态');
            updateDirBtnState();
          }
        } catch (e) {
          console.warn('自动请求权限被拦截或失败，需要手动点击「待授权」按钮：', e);
          pendingDirHandle = savedHandle;
          updateDirBtnState();
        }
      }, 300);
    }
  } else {
    updateDirBtnState();
  }

  showHome();
}

boot();
</script>
