<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>影视搜索</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="src-swiper" id="srcSwiper">
    <div class="src-track" id="srcTrack"></div>
  </div>
<div class="searchrow">
  <input id="kw" type="text" placeholder="电影名称" autocomplete="off">
  <button id="btnSearch" class="button" aria-label="搜索">
    <div>
      <span>
        <span class="spinner"></span>
        <span class="btxt">搜索</span>
      </span>
    </div>
  </button>
</div>
</div>

<div id="stat" class="stat" style="display:none"></div>
<div id="content"></div>

<div class="mask" id="mask">
  <div class="sheet">
    <div class="sheethead">
      <div class="thumb" id="dThumb"></div>
      <div class="info">
        <h2 id="dName">—</h2>
        <div class="meta" id="dMeta">—</div>
      </div>
      <button class="close" id="btnClose" aria-label="关闭">×</button>
    </div>
    <div class="sheetbody" id="dBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   全局配置
   ============================================================ */
const CONFIG = {
  relay: '/proxy?url=',
  timeout: 20000,
};

let currentSource = 'cilixiong';
let hlsInstance = null;
let detailOpen = false;
let currentDetailItem = null;
let searchToken = 0;

let pageState = {
  prevUrl: '',
  nextUrl: '',
  hasPrev: false,
  hasMore: false,
  currentPage: 1,
  totalPages: 1,
  totalCount: 0,
  currentKeyword: '',
  // 飞流专用
  flixLastRank: null,
  flixAllList: []
};

const MEDIA_RE = /\.(m3u8|mp4|flv)(\?|#|$)/i;

/* ============================================================
   数据源
   ============================================================ */
const SOURCES = {
  /* ------------------------- 磁力熊 ------------------------- */
  cilixiong: {
    name: '磁力熊',
    base: 'https://www.cilixiong.org',
    searchPath: '/e/search/index.php',

    getSearchUrl: function(kw){
      return this.base + this.searchPath;
    },
    getSearchUrlGet: function(kw){
      return this.base + this.searchPath +
        '?searchget=1&classid=1,2&show=title&tempid=1&keyboard=' +
        encodeURIComponent(kw);
    },
    getSearchOptions: function(kw){
      const body = encodeForm({ classid:'1,2', show:'title', tempid:'1', keyboard: kw });
      return {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      };
    },

    parseList: function(html){
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const list = [];
      const seen = new Set();

      const pushItem = (nameEl, yearEl, rankEl, coverEl, href) => {
        if(!nameEl) return;
        const name = nameEl.textContent.trim();
        if(!name || seen.has(href + name)) return;
        seen.add(href + name);

        let cover = '';
        if(coverEl){
          const bg = coverEl.getAttribute('style') || '';
          const m = bg.match(/url\(['"]?([^'")]+)['"]?\)/);
          if(m) cover = m[1];
        }
        list.push({
          name,
          year: yearEl ? yearEl.textContent.trim() : '',
          rank: rankEl ? rankEl.textContent.trim() : '',
          cover: abs(cover, this.base),
          href: abs(href, this.base)
        });
      };

      doc.querySelectorAll('.card.card-cover').forEach(card => {
        const a = card.closest('a') || card.querySelector('a');
        if(!a) return;
        pushItem(
          card.querySelector('.pt-5.lh-1.pb-2.h4') || card.querySelector('h2'),
          card.querySelector('.d-flex.align-items-center.small'),
          card.querySelector('.rank'),
          card.querySelector('.card-img'),
          a.getAttribute('href')
        );
      });

      if(list.length === 0){
        doc.querySelectorAll('a[href*="/movie/"]').forEach(a => {
          const card = a.querySelector('.card') || a;
          pushItem(
            card.querySelector('.pt-5.lh-1.pb-2.h4') || card.querySelector('h2'),
            card.querySelector('.d-flex.align-items-center.small'),
            card.querySelector('.rank'),
            card.querySelector('.card-img'),
            a.getAttribute('href')
          );
        });
      }

      return {
        list,
        prevUrl:'', nextUrl:'', hasPrev:false, hasMore:false,
        currentPage:1, totalPages:1, totalCount: list.length
      };
    },

    parseDetail: function(html){
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const magnets = [];
      const seen = new Set();

      doc.querySelectorAll('a[href^="magnet:"]').forEach(a => {
        const href = a.getAttribute('href');
        if(!href || seen.has(href)) return;
        seen.add(href);
        const text = a.textContent.trim();
        let size = '';
        const m = text.match(/\[([^\]]+)\]\s*$/);
        if(m) size = m[1];
        magnets.push({ title: text || '磁力资源', size, magnet: href });
      });

      let playPageUrl = '';
      const iframe = doc.querySelector('.embed_video iframe') || doc.querySelector('iframe[src*="jx.php"]');
      if(iframe){
        const src = iframe.getAttribute('src') || '';
        if(src) playPageUrl = abs(src, this.base);
      }

      return { magnets, playPageUrl, playList: [] };
    }
  },

/* ------------------------ 小蜜蜂影院 ------------------------ */
xiaomifeng: {
  name: '小蜜蜂',
  base: 'https://www.xmfyy.com',

getSearchUrl: function(kw, page, sort){
  page = page || 1;
  sort = sort || 'hits';
  return this.base + '/search?keyword=' + encodeURIComponent(kw)
       + '&page=' + page
       + '&sort=' + sort;
},
  getSearchUrlGet: function(kw){
    return this.getSearchUrl(kw);
  },
  getSearchOptions: function(kw){
    return { method: 'GET' };
  },

  parseList: function(html){
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const list = [];
    const seen = new Set();

    doc.querySelectorAll('.search-item').forEach(item => {
      const a = item.querySelector('a.search-item-poster');
      if(!a) return;
      const href = a.getAttribute('href') || '';
      if(!href || seen.has(href)) return;

      const cover = pickAttr(item, 'img', 'src');

      let name = '';
      const alt = pickAttr(item, 'img', 'alt');
      if(alt) name = alt.replace(/封面图片$/, '').trim();
      if(!name) name = pickText(item, '.search-item-title, h3, .title');
      if(!name) return;

      seen.add(href);
      list.push({
        name,
        year: '',
        rank: '',
        cover: abs(cover, this.base),
        href: abs(href, this.base)
      });
    });

  // ★ 解析分页信息
  let currentPage = 1, totalPages = 1, totalCount = list.length;

  // ① 从 #pageData 拿 currentpage / totalpages
  const pd = doc.querySelector('#pageData');
  if(pd){
    currentPage = parseInt(pd.dataset.currentpage || '1', 10) || 1;
    totalPages  = parseInt(pd.dataset.totalpages  || '1', 10) || 1;
  }

  // ② 从搜索摘要里拿"共 N 个结果"
  const sumEl = doc.querySelector('.search-summary em');
  // .search-summary 里第一个 em 是关键词，第二个 em 是结果数
  const sumEms = doc.querySelectorAll('.search-summary em');
  if(sumEms.length >= 2){
    const n = parseInt(sumEms[1].textContent.trim(), 10);
    if(!isNaN(n)) totalCount = n;
  }

  // ③ 拼上一页 / 下一页 URL
  const kw = pageState.currentKeyword || '';
  const sort = 'hits';
  const baseSearch = this.base + '/search?keyword=' + encodeURIComponent(kw) + '&sort=' + sort;
  let prevUrl = '';
  let nextUrl = '';
  if(currentPage > 1){
    prevUrl = baseSearch + '&page=' + (currentPage - 1);
  }
  if(currentPage < totalPages){
    nextUrl = baseSearch + '&page=' + (currentPage + 1);
  }

  return {
    list,
    prevUrl,
    nextUrl,
    hasPrev: currentPage > 1,
    hasMore: currentPage < totalPages,
    currentPage,
    totalPages,
    totalCount
  };
},

  parseDetail: function(html){
    const doc = new DOMParser().parseFromString(html, 'text/html');

    let cover = abs(pickAttr(doc, '.detail-card img, .vod-detail img, .detail-pic img, img', 'src'), this.base);

    // 线路名（按 source-tab 出现顺序）
    const lineNames = [];
    doc.querySelectorAll('.source-tabs .source-tab').forEach(btn => {
      lineNames.push((btn.textContent || '').trim() || ('线路' + (lineNames.length + 1)));
    });

    // 每线路集数（按 source-panel 顺序）
    const playList = [];
    const seen = new Set();

    doc.querySelectorAll('.source-panel').forEach((panel, idx) => {
      const lineName = lineNames[idx] || ('线路' + (idx + 1));
      panel.querySelectorAll('a.episode-btn[href]').forEach(a => {
        const href = a.getAttribute('href') || '';
        if(!href || seen.has(href)) return;
        seen.add(href);

const epName = (a.textContent || '').trim() || '正片';
const m = href.match(/\/vodplay\/(\d+)-([^-]+)-(\d+)\.html/);
if(!m) return;
playList.push({
  lineName,
  epName,
  vodId: m[1],
  playFrom: m[2],
  index: m[3],
  url: abs(href, this.base)
});
      });
    });

    return { cover, magnets: [], playPageUrl: '', playList };
  }
},

/* ------------------------ 飞快TV ------------------------ */
feikuai: {
  name: '飞快TV',
  base: 'https://feikuai.in',

  getSearchUrl: function(kw, page){
    page = page || 1;
    return this.base + '/vodsearch/' + encodeURIComponent(kw) +
           '----------' + page + '---.html?mx_search_scope=in';
  },
  getSearchUrlGet: function(kw, page){
    return this.getSearchUrl(kw, page);
  },
  getSearchOptions: function(kw){
    return { method: 'GET' };
  },

  parseList: function(html){
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const list = [];
    const seen = new Set();

    doc.querySelectorAll('div.module-card-item.module-item').forEach(card => {
      const titleA = card.querySelector('.module-card-item-title a');
      if(!titleA) return;
      const href = titleA.getAttribute('href') || '';
      if(!href || seen.has(href)) return;

      const nameEl = titleA.querySelector('strong');
      const name = nameEl ? nameEl.textContent.trim() : titleA.textContent.trim();
      if(!name) return;
      seen.add(href);

      const cover = pickAttr(card, '.module-item-pic img',
        'data-original,data-remote,data-local,data-fallback,src');

      const info = pickText(card, '.module-info-item-content');
      const note = pickText(card, '.module-item-note');
      const rank = pickText(card, '.module-item-douban');
      const vodId = (href.match(/\/voddetail\/(\d+)/) || [])[1] || '';

      list.push({
        name,
        year: info,
        rank,
        status: note,
        cover: abs(cover, this.base),
        href: abs('/vodplay/' + vodId + '-1-1.html', this.base)
      });
    });

    let currentPage = 1, totalPages = 1, totalCount = list.length;
    const meta = doc.querySelector('#paging-meta');
    if(meta){
      currentPage = parseInt(meta.getAttribute('data-page') || '1', 10) || 1;
      totalPages  = parseInt(meta.getAttribute('data-total') || '1', 10) || 1;
    }
    const totalText = pickText(doc, '#ajax-total, .mac_total');
    const n = parseInt(totalText, 10);
    if(!isNaN(n)) totalCount = n;

    const kw = pageState.currentKeyword || '';
    let prevUrl = '', nextUrl = '';
    if(currentPage > 1) prevUrl = this.getSearchUrl(kw, currentPage - 1);
    if(currentPage < totalPages) nextUrl = this.getSearchUrl(kw, currentPage + 1);

    return {
      list, prevUrl, nextUrl,
      hasPrev: currentPage > 1,
      hasMore: currentPage < totalPages,
      currentPage, totalPages, totalCount
    };
  },

  parseDetail: function(html){
    const doc = new DOMParser().parseFromString(html, 'text/html');
    let cover = abs(pickAttr(doc, '.module-item-pic img, .detail-pic img', 'data-original,src'), this.base);

    const playList = [];
    const seen = new Set();

    const jsonScript = doc.querySelector('#fk-online-download-data');
    if(jsonScript){
      try {
        const data = JSON.parse(jsonScript.textContent);
        (data.sources || []).forEach(src => {
          const lineName = src.show || ('线路' + src.sid);
          (src.episodes || []).forEach(ep => {
            const url = ep.url || '';
            if(!url || seen.has(url)) return;
            seen.add(url);
            playList.push({
              lineName,
              epName: ep.name || ('第' + ep.nid + '集'),
              vodId: String(data.vodId || ''),
              playFrom: src.from || '',
              index: String(ep.nid || ''),
              url
            });
          });
        });
      } catch(e) {
        console.warn('飞快TV JSON 解析失败：', e);
      }
    }

    if(playList.length === 0){
      const m = html.match(/var\s+player_aaaa\s*=\s*(\{[\s\S]*?\})\s*<\/script>/);
      if(m){
        try {
          const cfg = JSON.parse(m[1]);
          if(cfg && cfg.url){
            let realUrl = cfg.url;
            try { realUrl = atob(cfg.url); } catch(e){}
            playList.push({
              lineName: '当前线路',
              epName: '当前集',
              vodId: String(cfg.id || ''),
              playFrom: cfg.from || '',
              index: String(cfg.nid || ''),
              url: realUrl
            });
          }
        } catch(e){}
      }
    }

    return { cover, magnets: [], playPageUrl: '', playList };
  }
},

  /* ------------------------ 非凡资源 ------------------------ */
  ffzy: {
    name: '非凡资源',
    base: 'https://www.ffzy.tv',

    getSearchUrl: function(kw){
      return this.base + '/index.php/vod/search.html';
    },
    getSearchUrlGet: function(kw){
      return this.base + '/index.php/vod/search.html?wd=' + encodeURIComponent(kw);
    },
    getSearchOptions: function(kw){
      const body = encodeForm({ wd: kw });
      return {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      };
    },

    parseList: function(html){
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const list = [];

      let items = doc.querySelectorAll('ul.videoContent > li');
      if(items.length === 0) items = doc.querySelectorAll('a.videoName');

      items.forEach(node => {
        let a = null;
        let scope = node;
        if(node.tagName === 'A'){
          a = node;
          scope = node.closest('li') || node;
        }else{
          a = node.querySelector('a.videoName') || node.querySelector('a.address');
        }
        if(!a) return;

        const href = a.getAttribute('href');
        if(!href) return;

        const clone = a.cloneNode(true);
        const statusEl = clone.querySelector('i');
        const status = statusEl ? statusEl.textContent.trim() : '';
        if(statusEl) statusEl.remove();
        const name = clone.textContent.trim() || '未知片名';

        const regionEl = scope.querySelector('.region');
        const typeEl   = scope.querySelector('.category') || scope.querySelector('.type');
        const timeEl   = scope.querySelector('.time1')    || scope.querySelector('.time');

        list.push({
          name,
          year:   timeEl   ? timeEl.textContent.trim()   : '',
          rank:   typeEl   ? typeEl.textContent.trim()   : '',
          region: regionEl ? regionEl.textContent.trim() : '',
          status,
          cover: '',
          href:  abs(href, this.base)
        });
      });

      let prevUrl = '', nextUrl = '';
      let hasPrev = false, hasMore = false;
      let currentPage = 1, totalPages = 1, totalCount = list.length;

      const pageBox = doc.querySelector('.pages') || doc.querySelector('.page') || doc.querySelector('.kscont');
      if(pageBox){
        const links = parseAnchorPageInfo(pageBox, this.base);
        if(links.prevUrl){ prevUrl = links.prevUrl; hasPrev = true; }
        if(links.nextUrl){ nextUrl = links.nextUrl; hasMore = true; }

        const statSpan = pageBox.querySelector('span.disabled') || pageBox;
        const text = statSpan ? (statSpan.textContent || '') : '';
        const m = text.match(/共\s*(\d+)\s*条数据.*?当前\s*(\d+)\s*\/\s*(\d+)\s*页/);
        if(m){
          totalCount  = parseInt(m[1], 10) || list.length;
          currentPage = parseInt(m[2], 10) || 1;
          totalPages  = parseInt(m[3], 10) || 1;
        }else{
          const activeSpan = pageBox.querySelector('span.active');
          if(activeSpan){
            const num = parseInt(activeSpan.textContent, 10);
            if(!isNaN(num)) currentPage = num;
          }
        }
      }

      if(currentPage <= 1){ hasPrev = false; prevUrl = ''; }
      if(currentPage >= totalPages){ hasMore = false; nextUrl = ''; }

      return { list, prevUrl, nextUrl, hasPrev, hasMore, currentPage, totalPages, totalCount };
    },

    parseDetail: function(html){
      const doc = new DOMParser().parseFromString(html, 'text/html');

      let cover = abs(pickAttr(doc, '.left img, .vodImg img', 'src'), this.base);

      const playList = [];
      const seen = new Set();

      doc.querySelectorAll('input[name*="copy_ffm3u8"]').forEach(ipt => {
        const val = (ipt.value || '').trim();
        if(!val.includes('$')) return;
        const idx = val.indexOf('$');
        const quality = val.slice(0, idx).trim() || '正片';
        const url     = val.slice(idx + 1).trim();
        if(!url || seen.has(url)) return;
        seen.add(url);
        playList.push({ title: quality, url });
      });

      if(playList.length === 0){
        const text = doc.body ? (doc.body.innerText || doc.body.textContent || '') : '';
        for(const m of text.matchAll(/([^\n\$]+?)\$((?:https?:\/\/)[^\s\$\n]+?\.m3u8[^\s\$\n]*)/gi)){
          const quality = m[1].trim();
          const url = m[2].trim();
          if(seen.has(url)) continue;
          seen.add(url);
          playList.push({ title: quality, url });
        }
      }

      return { cover, magnets: [], playPageUrl: '', playList };
    }
  },

  /* -------------------------- 奈飞 -------------------------- */
  netflix: {
    name: '奈飞',
    base: 'https://netflixgc.net',

    getSearchUrl: function(kw){
      return this.base + '/vodsearch/-------------.html?wd=' + encodeURIComponent(kw);
    },
    getSearchUrlGet: function(kw){
      return this.base + '/vodsearch/-------------.html?wd=' + encodeURIComponent(kw);
    },
    getSearchOptions: function(kw){
      return { method: 'GET' };
    },

parseList: function(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const list = [];
  const seen = new Set();

  const pickCover = (scope) => pickAttr(scope, '.detail-pic img, img', 'data-src,src');

  /* ---------- ① 解析列表 ---------- */
  const boxes = doc.querySelectorAll('.public-list-box');
  if(boxes.length){
    boxes.forEach(box => {
      const a = box.querySelector('a[href*="/voddetail/"]');
      if(!a) return;
      const href = a.getAttribute('href') || '';
      if(!href || seen.has(href)) return;

      const name = pickText(box, '.slide-info-title, h3');
      if(!name) return;
      seen.add(href);

      const year = pickText(box, '.public-list-prb, .slide-info-remarks');

      list.push({
        name,
        year,
        rank: '',
        cover: abs(pickCover(box), this.base),
        href: abs(href, this.base)
      });
    });
  }

  /* ★ 奈飞搜索页用 .search-list，补上 */
  if(list.length === 0){
    doc.querySelectorAll('.search-list').forEach(box => {
      const a = box.querySelector('a[href*="/voddetail/"]');
      if(!a) return;
      const href = a.getAttribute('href') || '';
      if(!href || seen.has(href)) return;

      const name = pickText(box, '.slide-info-title, h3');
      if(!name) return;
      seen.add(href);

      const year = pickText(box, '.slide-info-remarks');

      list.push({
        name,
        year,
        rank: '',
        cover: abs(pickCover(box), this.base),
        href: abs(href, this.base)
      });
    });
  }

  /* ★ 兜底：直接找 /voddetail/ */
  if(list.length === 0){
    doc.querySelectorAll('a[href*="/voddetail/"]').forEach(a => {
      const href = a.getAttribute('href') || '';
      if(!href || seen.has(href)) return;

      const scope = a.closest('.search-list') ||
                    a.closest('.public-list-box') ||
                    a.closest('li') ||
                    a.parentElement || a;

      const name = pickText(scope, '.slide-info-title, h3') || a.textContent.trim();
      if(!name || name.length > 60) return;
      seen.add(href);

      list.push({
        name,
        year: '',
        rank: '',
        cover: abs(pickCover(scope), this.base),
        href: abs(href, this.base)
      });
    });
  }

  /* ---------- ② 分页解析 ---------- */
  let currentPage = 1;
  let totalPages  = 1;
  let totalCount  = list.length;
  let prevUrl     = '';
  let nextUrl     = '';

  /* 结果总数：.mac-total */
  const macTotalEl = doc.querySelector('.mac-total');
  if(macTotalEl){
    const n = parseInt(macTotalEl.textContent.trim(), 10);
    if(!isNaN(n)) totalCount = n;
  }

  /* 当前页/总页数：.page-tip 文本 "共93条数据,当前1/10页" */
  const pageTip = doc.querySelector('.pages .page-tip');
  if(pageTip){
    const text = pageTip.textContent || '';
    const m1 = text.match(/共\s*(\d+)\s*条/);
    const m2 = text.match(/当前\s*(\d+)\s*\/\s*(\d+)\s*页/);
    if(m1){
      const n = parseInt(m1[1], 10);
      if(!isNaN(n)) totalCount = n;
    }
    if(m2){
      currentPage = parseInt(m2[1], 10) || 1;
      totalPages  = parseInt(m2[2], 10) || 1;
    }
  }

  /* 上一页 / 下一页 URL */
  const links = parseAnchorPageInfo(doc, this.base);
  prevUrl = links.prevUrl;
  nextUrl = links.nextUrl;

  const hasPrev = currentPage > 1;
  const hasMore = currentPage < totalPages;
  if(!hasPrev) prevUrl = '';
  if(!hasMore) nextUrl = '';

  return {
    list,
    prevUrl,
    nextUrl,
    hasPrev,
    hasMore,
    currentPage,
    totalPages,
    totalCount
  };
},

    parseDetail: function(html){
      const doc = new DOMParser().parseFromString(html, 'text/html');

      const cover = abs(pickAttr(doc, '.detail-pic img, .vodImg img', 'data-src,src'), this.base);
      const playList = parseTabBoxPlayList(doc, this.base);

      return { cover, magnets: [], playPageUrl: '', playList };
    }
  },

  /* ------------------------ 飞流视频 ------------------------ */
  flixflop: {
    name: '飞流视频',
    base: 'https://www.flixflop.com',
    api: 'https://www.flixflop.com/api',

    /* 搜索：直接调 API（第 1 页 rank=0） */
    getSearchUrl: function(kw){

    },
    getSearchUrlGet: function(kw){

      return {
        method: 'GET',
        headers: { 'Accept': 'application/json' }
      };
    },

    /* 翻页：用 rank 游标 */
    getNextPageUrl: function(kw, lastRank){
      return this.api + '/v1/explore/search?query=' + encodeURIComponent(kw) + '&rank=' + lastRank;
    },

    /* 解析 JSON（搜索结果） */
    parseList: function(text){
      let obj;
      try { obj = typeof text === 'string' ? JSON.parse(text) : text; }
      catch(e){
        return { list:[], totalCount:0, currentPage:1, totalPages:1, hasPrev:false, hasMore:false };
      }
      return this._parseListFromJson(obj);
    },

_parseListFromJson: function(obj){
  const data = obj.data || [];
  const list = data
    .filter(it => {
      // ★ 只过滤"电影解说"
      const cat = String(it.category || '');
      const title = String(it.title || '');
      if (cat === '电影解说') return false;
      if (/\[电影解说\]/.test(title)) return false;
      return true;
    })
    .map(it => ({
      name: it.title,
      year: String(it.published_year || ''),
      rank: it.remarks || '',
      region: it.area || '',
      cover: it.cover_image || '',
      href: this.base + '/streams/' + it.video_id + '/detail',
      _videoId: it.video_id,
      _rank: it.rank,
      _sources: it.sources || []
    }));

  // ★ 分页游标和 hasMore 用原始 data（不能过滤，否则翻页会错）
  const lastRank = data.length ? String(data[data.length - 1].rank) : null;

  return {
    list,
    prevUrl:'', nextUrl:'',
    hasPrev: false,
    hasMore: data.length >= 10,
    currentPage: 1,
    totalPages: 1,
    totalCount: list.length,
    _lastRank: lastRank
  };
},

    /* 详情：飞流在搜索结果里已经带了 sources，这里直接返回 */
    parseDetail: function(html){
      return { cover:'', magnets:[], playPageUrl:'', playList:[] };
    },

    /* 飞流专用：从 item._sources 展开播放列表 */
    buildPlayListFromSources: function(sources){
      const SOURCE_NAMES = {
        '204817109715256315': '大陆',
        '480834192939156104': '星空',
        '481120574047781513': '正片'
      };
      const playList = [];
      const seen = new Set();
      (sources || []).forEach(src => {
        const lineName = SOURCE_NAMES[src.source_id] || ('线路' + String(src.source_id).slice(-4));
        (src.url || '').split('#').forEach(ep => {
          const idx = ep.indexOf('$');
          if (idx < 0) return;
          const epName = ep.slice(0, idx).trim() || '正片';
          const m3u8 = ep.slice(idx + 1).trim();
          if (!m3u8 || !/\.m3u8/i.test(m3u8) || seen.has(m3u8)) return;
          seen.add(m3u8);
          playList.push({ lineName, epName, url: m3u8 });
        });
      });
      return playList;
    }
  }
};

function encodeForm(obj){

function abs(url, base){
  if(!url) return '';
  url = String(url).trim();
  if(!url) return '';
  if(url.startsWith('http://') || url.startsWith('https://')) return url;
  if(url.startsWith('//')) return 'https:' + url;
  return base + (url.startsWith('/') ? '' : '/') + url;
}

/* 依次尝试多个选择器，返回第一个非空文本 */
function pickText(scope, selectors){
  if(!scope) return '';
  const list = String(selectors).split(',').map(s => s.trim());
  for(const sel of list){
    const el = scope.querySelector(sel);
    if(el){
      const t = (el.textContent || '').trim();
      if(t) return t;
    }
  }
  return '';
}

/* 依次尝试多个选择器 + 多个属性，返回第一个非空值 */
function pickAttr(scope, selectors, attrs){
  if(!scope) return '';
  const selList  = String(selectors).split(',').map(s => s.trim());
  const attrList = String(attrs).split(',').map(s => s.trim());
  for(const sel of selList){
    const el = scope.querySelector(sel);
    if(!el) continue;
    for(const attr of attrList){
      const v = el.getAttribute(attr);
      if(v && v.trim()) return v.trim();
    }
  }
  return '';
}

/* 拿"上一页 / 下一页"两个链接（从 a[title]） */
function parseAnchorPageInfo(scope, base){
  let prevUrl = '', nextUrl = '';
  const prevA = scope.querySelector('a[title="上一页"]');
  if(prevA){
    const h = prevA.getAttribute('href') || '';
    if(h && !h.includes('javascript:') && h !== '#') prevUrl = abs(h, base);
  }
  const nextA = scope.querySelector('a[title="下一页"]');
  if(nextA){
    const h = nextA.getAttribute('href') || '';
    if(h && !h.includes('javascript:') && h !== '#') nextUrl = abs(h, base);
  }
  return { prevUrl, nextUrl };
}

/* 拿"tab + box"结构的线路/集数（奈飞详情页用） */
function parseTabBoxPlayList(doc, base){
  const tabs  = doc.querySelectorAll('.vod-playerUrl');
  const boxes = doc.querySelectorAll('.anthology-list-box');
  const playList = [];
  const seen = new Set();
  const total = Math.max(tabs.length, boxes.length);

  for(let i = 0; i < total; i++){
    let lineName = '';
    if(tabs[i]){
      const clone = tabs[i].cloneNode(true);
      clone.querySelectorAll('.badge, i').forEach(el => el.remove());
      lineName = (clone.textContent || '').replace(/\s+/g, ' ').trim();
    }
    if(!lineName) lineName = '线路' + (i + 1);

    const box = boxes[i];
    if(!box) continue;

    box.querySelectorAll('a[href*="/vodplay/"]').forEach(a => {
      const href = a.getAttribute('href') || '';
      if(!href || seen.has(href)) return;
      seen.add(href);
      const sp = a.querySelector('span');
      let epName = sp ? sp.textContent.trim() : (a.textContent || '').trim();
      if(!epName) epName = '正片';
      playList.push({ lineName, epName, url: abs(href, base) });
    });
  }
  return playList;
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s){
  return escapeHtml(s).replace(/`/g,'&#96;');
}

function extractVideoUrl(text){
  if(!text) return '';

  let s = String(text)
    .replace(/\\\//g, '/')
    .replace(/&amp;/g, '&')
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'")
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>');

  const normalize = (u) => {
    if(!u) return u;
    try {
      return new URL(u).href;
    } catch(e) {
      return u.replace(/[\u4e00-\u9fa5\s]/g, c => encodeURIComponent(c));
    }
  };

  const urlParamRe = /[?&]url=(https?:\/\/[^\s"'<>&]+?\.(?:m3u8|mp4|flv)[^\s"'<>&]*)/gi;
  let m;
  while((m = urlParamRe.exec(s)) !== null){
    const u = m[1];
    if(MEDIA_RE.test(u)) return normalize(u);
  }

  const patterns = [
    /https?:\/\/[^\s"'<>\\]+?\.m3u8[^\s"'<>\\]*/i,
    /https?:\/\/[^\s"'<>\\]+?\.mp4[^\s"'<>\\]*/i,
    /https?:\/\/[^\s"'<>\\]+?\.flv[^\s"'<>\\]*/i,
  ];
  for(let i=0;i<patterns.length;i++){
    const mm = s.match(patterns[i]);
    if(mm) return normalize(mm[0]);
  }
  return '';
}

function extractPlayerIframe(html){
  if(!html) return '';

  const s = String(html).replace(/&amp;/g, '&');

  const re = /<iframe\b[^>]*?\bsrc\s*=\s*["']([^"']+)["'][^>]*>/gi;
  let m;
  const candidates = [];
  while((m = re.exec(s)) !== null){
    let src = m[1].replace(/&quot;/g, '"').trim();
    if(src.startsWith('//')) src = 'https:' + src;
    if(/^https?:/i.test(src)) candidates.push(src);
  }

  for(let i = 0; i < candidates.length; i++){
    if(/ec\.php/i.test(candidates[i])) return candidates[i];
  }
  for(let i = 0; i < candidates.length; i++){
    if(/netflixgc/i.test(candidates[i])) return candidates[i];
  }
  for(let i = 0; i < candidates.length; i++){
    if(/union\.maccms|prestrain|ads?|advert|doubleclick|googlesyndication/i.test(candidates[i])) continue;
    return candidates[i];
  }

  const pm = html.match(/var\s+player_aaaa\s*=\s*(\{[\s\S]*?\})\s*;?\s*(?:<\/script>|$)/);
  if(pm){
    try {
      const obj = JSON.parse(pm[1]);
      if(obj && obj.url){
        let decoded = obj.url;
        try { decoded = atob(obj.url); } catch(e){}
        try { decoded = decodeURIComponent(decoded); } catch(e){}
        if(!decoded) decoded = obj.url;
        return 'https://cjbfq.netflixgc.tv/player/ec.php?code=netflix&if=1&url=' + decoded;
      }
    } catch(e){}
  }

  return '';
}

function extractM3U8FromIframeUrl(iframeUrl){
  if(!iframeUrl) return '';
  const m = iframeUrl.match(/[?&]url=([^&\s"'<>]+)/i);
  if(!m) return '';
  let decoded = m[1];

  decoded = decoded.replace(/%u([0-9a-fA-F]{4})/g, function(_, hex){
    return String.fromCharCode(parseInt(hex, 16));
  });

  for(let i = 0; i < 2; i++){
    try {
      const d = decodeURIComponent(decoded);
      if(d === decoded) break;
      decoded = d;
    } catch(e){ break; }
  }

  try {
    decoded = new URL(decoded).href;
  } catch(e){
    decoded = decoded.replace(/[\u4e00-\u9fa5\s]/g, c => encodeURIComponent(c));
  }

  return /^https?:\/\//i.test(decoded) && MEDIA_RE.test(decoded) ? decoded : '';
}

/* ============================================================
   整合修正版：手势控制 + 全屏/横屏切换
   1. 左右 30% 双击：快进 / 快退 10 秒
   2. 全屏下半屏滑动：调节播放进度（实时 UI + Toast）
   3. 单击屏幕：延迟 300ms 切换控制面板显示/隐藏（避免与双击冲突）
   4. 包含兼容多端的全屏/横屏切换逻辑 (toggleFullscreen)
   ============================================================ */
(function initDoubleTapAndSwipeSeek(){
  const SIDE_RATIO   = 0.3;
  const JUMP_SEC     = 10;

  function getVideo(){
    return document.getElementById('playerVideo');
  }
  function isPlayerVisible(){
    const c = document.getElementById('playerContainer');
    return c && c.style.display !== 'none';
  }
  function fmt(s){
    if(!isFinite(s)) return '0:00';
    const m = Math.floor(s / 60), ss = Math.floor(s % 60);
    return m + ':' + (ss < 10 ? '0' : '') + ss;
  }

  // 1. 兼容多端的全屏状态判定
  function isFullscreen() {
    return !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.mozFullScreenElement ||
      document.msFullscreenElement
    );
  }

  container.addEventListener('click', (e) => {
    if (e.target.closest('.video-ctrl')) return;
    if (Date.now() - lastTouchTs < 600) return;
    container.classList.toggle('ctrl-show');
  });

  /* ---------- 全屏状态变化时同步方向锁（兜底） ---------- */
  if(!document.__orientBound){
    document.__orientBound = true;

    const handleFsChange = () => {
      const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
      if(fsEl){
        // 进入全屏
        try {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape-primary').catch(()=>{});
          }
        } catch(e){}
      } else {
        // 退出全屏（不管怎么退出的）
        try {
          if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
          }
        } catch(e){}
      }
    };

    document.addEventListener('fullscreenchange', handleFsChange);
    document.addEventListener('webkitfullscreenchange', handleFsChange);
  }
}

  // 3. 带有错误捕获与多端兼容的全屏/横屏切换（挂载到全局 window.toggleFullscreen）
  window.toggleFullscreen = async function toggleFullscreen() {
    const container = document.getElementById('playerContainer');
    if (!container) return;

    if (!isFullscreen()) {
      try {
        if (container.requestFullscreen) {
          await container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          await container.webkitRequestFullscreen();
        } else if (container.mozRequestFullScreen) {
          await container.mozRequestFullScreen();
        } else if (container.msRequestFullscreen) {
          await container.msRequestFullscreen();
        }
      } catch (e) {
        console.warn('全屏请求被拒绝或不支持:', e);
      }

      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape-primary').catch(() => {});
      }
    } else {
      try {
        if (document.exitFullscreen) {
          await document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          await document.webkitExitFullscreen();
        } else if (document.mozCancelFullScreen) {
          await document.mozCancelFullScreen();
        } else if (document.msExitFullscreen) {
          await document.msExitFullscreen();
        }
      } catch (e) {
        console.warn('退出全屏失败:', e);
      }

      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
    }
  };

  /* ---------- 双击快进/快退与提示 ---------- */
  function showJumpToast(side, delta, target){
    let el = document.getElementById('jumpToast');
    if(!el){
      el = document.createElement('div');
      el.id = 'jumpToast';
      el.style.cssText =
        'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);' +
        'background:rgba(0,0,0,.75);color:#fff;padding:12px 22px;' +
        'border-radius:12px;font-size:15px;font-weight:700;' +
        'z-index:999999;pointer-events:none;backdrop-filter:blur(6px);' +
        'transition:opacity .2s;';
      document.body.appendChild(el);
    }
    const arrow = delta > 0 ? '⏩ 快进' : '⏪ 回退';
    el.textContent = arrow + ' ' + Math.abs(delta) + 's → ' + fmt(target);
    el.style.opacity = '1';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.opacity = '0'; }, 800);
  }

  function handleDoubleTap(e){
    if(!isPlayerVisible()) return;
    const video = getVideo();
    if(!video || !video.duration) return;

    const t = e.changedTouches ? e.changedTouches[0] : e;
    const x = t.clientX;
    const w = window.innerWidth;
    const leftEdge  = w * SIDE_RATIO;
    const rightEdge = w * (1 - SIDE_RATIO);

    let delta = 0, side = '';
    if(x <= leftEdge){ delta = -JUMP_SEC; side = 'left'; }
    else if(x >= rightEdge){ delta = +JUMP_SEC; side = 'right'; }
    else return;

    let target = video.currentTime + delta;
    if(target < 0) target = 0;
    if(target > video.duration) target = video.duration;

    video.currentTime = target;
    showJumpToast(side, delta, target);
  }

  /* ---------- 统一的手势状态与全屏 Seek ---------- */
  let touchTimer = null;
  let lastTapTime = 0;
  let startX = 0, startY = 0;
  let isRealMove = false;
  let swiping = false;
  let startCurrent = 0, duration = 0;
  let swipeTarget = null;

  function getUI(){
    return window._playerUI || null;
  }

  function onStart(e){
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    isRealMove = false;
    swiping = false;

// 仅在全屏且下半屏触发 Seek 滑动
if (isFullscreen()) {
  const video = getVideo();
  const container = document.getElementById('playerContainer');
  if (video && video.duration && container) {
    const rect = container.getBoundingClientRect();
    if ((t.clientY - rect.top) >= rect.height * 0.5) {
      swiping = true;
      window._swiping = true;         // ← 新增
      startCurrent = video.currentTime;
      duration = video.duration;
      swipeTarget = null;
    }
  }
}
  }

  function onMove(e){
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;

    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
      isRealMove = true;
    }

    if (swiping && isRealMove && duration > 0) {
      const w = window.innerWidth;
      const deltaSec = (dx / w) * duration * 0.5;
      let target = startCurrent + deltaSec;
      if (target < 0) target = 0;
      if (target > duration) target = duration;

      swipeTarget = target;

      const ui = getUI();
      if(ui && ui.fill && ui.dot && ui.timeEl){
        const pct = (target / duration) * 100;
        ui.fill.style.width = pct + '%';
        ui.dot.style.left   = pct + '%';
        ui.timeEl.textContent = fmt(target) + ' / ' + fmt(duration);
      }

      const delta = target - startCurrent;
      showJumpToast(delta >= 0 ? 'right' : 'left', Math.round(delta), target);

      if(e.cancelable) e.preventDefault();
    }
  }

  function onEnd(e){
    // 1. 如果点击或触摸的目标在控制栏内部（包括进度条、播放按钮等），直接返回，不触发显隐切换
if (e.target && e.target.closest('.video-ctrl')) {
  if (swiping) swiping = false;
  window._swiping = false;              // ← 新增这一行
  isRealMove = false;
  return;
}

if (swiping) {
  swiping = false;
  window._swiping = false;              // ← 新增这一行
  if (isRealMove && swipeTarget !== null) {
    const video = getVideo();
    if (video) video.currentTime = swipeTarget;
  }
  swipeTarget = null;
}

    // 若发生了位移滑动，放弃点击与双击判定
    if (isRealMove) {
      if (touchTimer) {
        clearTimeout(touchTimer);
        touchTimer = null;
      }
      return;
    }

    // 单击 / 双击防冲突逻辑
    const now = Date.now();
    if (now - lastTapTime < 300) {
      clearTimeout(touchTimer);
      touchTimer = null;
      lastTapTime = 0;
      handleDoubleTap(e);
    } else {
      lastTapTime = now;
      touchTimer = setTimeout(() => {
        toggleControls();
        touchTimer = null;
      }, 300);
    }
  }


  /* ---------- 事件绑定 ---------- */
  function bind(){
    const container = document.getElementById('playerContainer');
    if(!container || container.__gestureBound) return;
    container.__gestureBound = true;

    container.addEventListener('touchstart',  onStart, { passive: false });
    container.addEventListener('touchmove',   onMove,  { passive: false });
    container.addEventListener('touchend',    onEnd);
    container.addEventListener('touchcancel', onEnd);
  }

  setInterval(bind, 600);
  document.addEventListener('fullscreenchange', () => setTimeout(bind, 100));
  document.addEventListener('webkitfullscreenchange', () => setTimeout(bind, 100));
})();



/* ============================================================

  const wrap       = ctrl.querySelector('.progress-wrap');

  window._playerUI = { fill: playedEl, buffered: bufferedEl, dot, timeEl, video };

// 1. 播放进度更新 (绿色层)
function updatePlayedUI() {
  if (window._swiping) return;                                 // ← 新增：全屏滑动时不覆盖
  if (typeof isDragging !== 'undefined' && isDragging) return; // 拖动时不覆盖
  if (video.duration && isFinite(video.duration)) {
    const pct = (video.currentTime / video.duration) * 100;
    playedEl.style.width = pct + '%';
    dot.style.left = pct + '%';
    timeEl.textContent = fmt(video.currentTime) + ' / ' + fmt(video.duration);
  }
}

  // 2. 缓冲进度更新 (红色层)
  function updateBufferedUI() {
    if (!video || !video.duration || !isFinite(video.duration) || !video.buffered || !video.buffered.length) return;

    const currentTime = video.currentTime;
    let bufferedEnd = 0;

    for (let i = 0; i < video.buffered.length; i++) {
      if (video.buffered.start(i) <= currentTime && currentTime <= video.buffered.end(i)) {
        bufferedEnd = video.buffered.end(i);
        break;
      }
    }

    if (bufferedEnd === 0 && video.buffered.length > 0) {
      bufferedEnd = video.buffered.end(video.buffered.length - 1);
    }

    const pct = (bufferedEnd / video.duration) * 100;
    bufferedEl.style.width = pct + '%';
  }

// 绑定播放与缓冲事件
video.addEventListener('timeupdate', updatePlayedUI);
video.addEventListener('progress', updateBufferedUI);
video.addEventListener('seeking', updateBufferedUI);
video.addEventListener('seeked', updateBufferedUI);

function fmt(s){
  if(!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return m + ':' + (ss < 10 ? '0' : '') + ss;
}


  /* ---------- 播放 / 暂停 ---------- */
  playBtn.onclick = () => { video.paused ? video.play() : video.pause(); };
  video.addEventListener('play',  () => { playBtn.textContent = '暂停'; });
  video.addEventListener('pause', () => { playBtn.textContent = '播放'; });

  /* ---------- 状态 ---------- */
  let dragPct     = 0;
  let isDragging  = false;
  let pendingSeek = null;

// 假设您的全局/上下文中有控制滑动状态的变量：
// swiping (是否正在屏幕滑动) 和 isDragging (是否正在拖拽进度条)




  function getPctFromX(clientX){
    const r = wrap.getBoundingClientRect();
    return Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  }

  function updateDragUI(clientX){
    const pct = getPctFromX(clientX);
    dragPct = pct;
    playedEl.style.width = pct * 100 + '%';
    dot.style.left   = pct * 100 + '%';
    if(video.duration && isFinite(video.duration)){
      timeEl.textContent = fmt(pct * video.duration) + ' / ' + fmt(video.duration);
    }
  }


  function canSeekTo(v, t){
    if(!v.seekable || v.seekable.length === 0) return false;
    for(let i = 0; i < v.seekable.length; i++){
      if(t >= v.seekable.start(i) && t <= v.seekable.end(i)) return true;
    }
    return false;
  }

function doSeek(target){
  const pct = video.duration ? target / video.duration : 0;
  playedEl.style.width = pct * 100 + '%';   // ✅ 用 playedEl
  dot.style.left       = pct * 100 + '%';
    if(video.duration && isFinite(video.duration)){
      timeEl.textContent = fmt(target) + ' / ' + fmt(video.duration);
    }
    // ② 能 seek 就立刻跳，不能就挂起
    if(canSeekTo(video, target)){
      video.currentTime = target;
      pendingSeek = null;
    } else {
      pendingSeek = target;
    }
  }

  function commitDrag(){
    if(!isDragging) return;
    isDragging = false;
    if(!video.duration || !isFinite(video.duration)) return;
    doSeek(dragPct * video.duration);
  }

  // 挂起的 seek 自动完成
  if(!video.__pendingSeekBound){
    video.__pendingSeekBound = true;
    const tryPending = () => {
      if(pendingSeek == null) return;
      if(canSeekTo(video, pendingSeek)){
        video.currentTime = pendingSeek;
        pendingSeek = null;
      }
    };
    video.addEventListener('progress', tryPending);
    video.addEventListener('canplay',  tryPending);
    video.addEventListener('seeked',   tryPending);
    setInterval(tryPending, 500);
  }

  /* ---------- 鼠标 ---------- */
  wrap.addEventListener('mousedown', e => {
    isDragging = true;
    updateDragUI(e.clientX);
  });
  window.addEventListener('mousemove', e => {
    if(isDragging) updateDragUI(e.clientX);
  });
  window.addEventListener('mouseup', () => {
    if(isDragging) commitDrag();
  });

/* ---------- 触摸进度条 ---------- */
wrap.addEventListener('touchstart', e => {
  e.stopPropagation(); // 阻止冒泡给容器，防止触发 toggleControls
  isDragging = true;
  updateDragUI(e.touches[0].clientX);
}, { passive: true });

// 阻止 click 事件冒泡，防止点击进度条时触发视频容器的 toggleControls
wrap.addEventListener('click', e => {
  e.stopPropagation();
});

wrap.addEventListener('touchmove', e => {
  if(!isDragging) return;
  updateDragUI(e.touches[0].clientX);
  if(e.cancelable) e.preventDefault();
}, { passive: false });

wrap.addEventListener('touchend', () => {
  if(isDragging) commitDrag();
});
wrap.addEventListener('touchcancel', () => {
  if(isDragging) commitDrag();
});

  /* ---------- 倍速 ---------- */
  const rates = [1, 1.25, 1.5, 2, 0.5, 0.75];
  let rateIdx = 0;
  rateBtn.onclick = () => {
    rateIdx = (rateIdx + 1) % rates.length;
    video.playbackRate = rates[rateIdx];
    rateBtn.textContent = rates[rateIdx] + 'x';
  };

/* ---------- 全屏（进入锁横屏 / 退出恢复竖屏） ---------- */
fsBtn.onclick = async () => {
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;

  if(fsEl){
    // ---------- 退出全屏 ----------
    try {
      if (document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
      else if (document.mozCancelFullScreen) await document.mozCancelFullScreen();
      else if (document.msExitFullscreen) await document.msExitFullscreen();
    } catch(e) {
      console.warn('退出全屏失败:', e);
    }

    // 恢复竖屏（部分浏览器支持，iOS Safari 不支持会自动忽略）
    try {
      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
    } catch(e){}

  } else {
    // ---------- 进入全屏 ----------
    try {
      if (container.requestFullscreen) await container.requestFullscreen();
      else if (container.webkitRequestFullscreen) await container.webkitRequestFullscreen();
      else if (container.mozRequestFullScreen) await container.mozRequestFullScreen();
      else if (container.msRequestFullscreen) await container.msRequestFullscreen();
    } catch(e) {
      console.warn('进入全屏失败:', e);
      return;
    }

    // ★ 关键：必须等全屏成功之后再锁横屏
    try {
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock('landscape-primary');
      }
    } catch(e) {
      console.warn('横屏锁定被拒绝:', e);
    }
  }
};

/* ---------- 点视频显示/隐藏控件（仅桌面端；移动端交给手势模块） ---------- */

function startHlsPlayer(videoUrl){
  const container = $('#playerContainer');
  const video = $('#playerVideo');
  const iframe = $('#playerIframe');
  if(!container || !video || !videoUrl) return;

  destroyHls();
  container.style.display = 'block';
  if(iframe){ iframe.style.display = 'none'; }
  if(video) video.style.display = 'block';

  const srcBase = (SOURCES[currentSource] && SOURCES[currentSource].base) || '';
  const referer = srcBase ? (srcBase.replace(/\/$/, '') + '/') : '';

  const proxiedSrc = CONFIG.relay + encodeURIComponent(videoUrl);
  const directSrc = videoUrl;

  if(typeof Hls === 'undefined' || !Hls.isSupported()){
    if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src = proxiedSrc;
      video.addEventListener('loadedmetadata', function(){
        video.play().catch(function(){});
      }, { once:true });
    } else {
      toast('当前浏览器不支持 HLS 播放');
    }
    return;
  }

  hlsInstance = new Hls({
    enableWorker: true,
    lowLatencyMode: true,
    manifestLoadingTimeOut: 20000,
    manifestLoadingMaxRetry: 2,
    fragLoadingTimeOut: 20000,
    fragLoadingMaxRetry: 2,
    xhrSetup: function(xhr, url){
      try {
        if(referer && url && url.indexOf('/proxy?url=') === 0){
          xhr.setRequestHeader('x-target-referer', referer);
        }
      } catch(e){}
    }
  });

  /* ---------- ★ 新增：HLS 分片加载完成 → 更新缓冲条 ---------- */
  hlsInstance.on(Hls.Events.FRAG_BUFFERED, function(){
    const v = document.getElementById('playerVideo');
    const bufferedEl = document.getElementById('progressBuffered');
    if(!v || !bufferedEl) return;
    if(!v.duration || !isFinite(v.duration)) return;
    if(!v.buffered || !v.buffered.length) return;

    const currentTime = v.currentTime;
    let bufferedEnd = 0;

    for(let i = 0; i < v.buffered.length; i++){
      if(v.buffered.start(i) <= currentTime && currentTime <= v.buffered.end(i)){
        bufferedEnd = v.buffered.end(i);
        break;
      }
    }
    if(bufferedEnd === 0 && v.buffered.length > 0){
      bufferedEnd = v.buffered.end(v.buffered.length - 1);
    }

    bufferedEl.style.width = (bufferedEnd / v.duration * 100) + '%';
  });

  let triedDirect = false;

  hlsInstance.on(Hls.Events.MANIFEST_PARSED, function(){
    video.play().catch(function(e){ console.log('自动播放被拦截:', e); });
  });

  hlsInstance.on(Hls.Events.ERROR, function(event, data){
    if(!data || !data.fatal) return;

    if(!triedDirect){
      triedDirect = true;
      console.warn('代理播放失败，尝试直连：', directSrc);
      try { hlsInstance.loadSource(directSrc); return; } catch(e){}
    }

    switch(data.type){
      case Hls.ErrorTypes.NETWORK_ERROR:
        toast('视频加载失败：网络错误');
        break;
      case Hls.ErrorTypes.MEDIA_ERROR:
        try{ hlsInstance.recoverMediaError(); }catch(e){ toast('视频解码失败'); }
        break;
      default:
        destroyHls();
        toast('播放器遇到致命错误');
        break;
    }
  });

  hlsInstance.loadSource(proxiedSrc);
  hlsInstance.attachMedia(video);
}

function playWithIframe(iframeSrc){
  if(!iframeSrc) return;

  const container = $('#playerContainer');
  const video = $('#playerVideo');
  const iframe = $('#playerIframe');
  if(!container || !iframe) return;

  if(hlsInstance){
    try{ hlsInstance.destroy(); }catch(e){}
    hlsInstance = null;
  }
  if(video){
    try{ video.pause(); }catch(e){}
    try{ video.removeAttribute('src'); video.load(); }catch(e){}
    video.style.display = 'none';
  }

  container.style.display = 'block';
  iframe.style.display = 'block';

  container.classList.remove('vodplay-mode');
  container.style.position = '';
  container.style.overflow = '';
  iframe.style.position = '';
  iframe.style.top = '';
  iframe.style.left = '';
  iframe.style.width = '100%';
  iframe.style.height = '100%';
  iframe.style.border = 'none';

  iframe.src = iframeSrc;
}

let lastReceivedCookie = '';

async function fetchViaRelay(url, opts, timeout){
  const target = CONFIG.relay + encodeURIComponent(url);
  const options = opts || {};
  const headers = options.headers || {};

  if (lastReceivedCookie) {
    headers['x-target-cookie'] = lastReceivedCookie;
  }
  options.headers = headers;

  const r = await fetchWithTimeout(target, options, timeout);

  const setCookie = r.headers.get('x-set-cookie');
  if (setCookie) {
    const m = setCookie.match(/cdndefend_js_cookie=[^;]+/);
    if (m) {
      lastReceivedCookie = m[0];
    }
  }

  if(!r.ok) {
    throw new Error('网络请求服务响应异常 (' + r.status + ')');
  }
  return await r.text();
}

async function requestUrl(url){
  return await fetchViaRelay(url, {});
}

async function doSearch(keyword){
  keyword = (keyword || '').trim();
  if(!keyword){ toast('请输入关键词'); return; }

  const myToken = ++searchToken;
  const mySource = currentSource;

  if(mySource === 'jiexi'){
    renderJiexiUI();
    return;
  }

  pageState.currentKeyword = keyword;
  pageState.prevUrl = '';
  pageState.nextUrl = '';
  pageState.hasPrev = false;
  pageState.hasMore = false;
  pageState.flixLastRank = null;
  pageState.flixAllList = [];

  const btn = $('#btnSearch');
  btn.classList.add('loading');
  renderSkeleton();

  try{
    const src = SOURCES[mySource];
    const postOpts = src.getSearchOptions(keyword);
    let txt = '';
    try {
      txt = await fetchViaRelay(src.getSearchUrl(keyword), postOpts);
    } catch (e) {
      txt = await fetchViaRelay(src.getSearchUrlGet(keyword), { method: 'GET' });
    }

    if(myToken !== searchToken) return;
    if(mySource !== currentSource) return;

    const result = src.parseList(txt);

    pageState.prevUrl     = result.prevUrl || '';
    pageState.nextUrl     = result.nextUrl || '';
    pageState.hasPrev     = !!result.hasPrev;
    pageState.hasMore     = !!result.hasMore;
    pageState.currentPage = result.currentPage || 1;
    pageState.totalPages  = result.totalPages || 1;
    pageState.totalCount  = result.totalCount || result.list.length;
    pageState.flixLastRank = result._lastRank || null;

    renderCards(result.list, keyword, false);
  }catch(e){
    console.error(e);
    if(myToken !== searchToken) return;
    if(mySource !== currentSource) return;
    renderError('请求失败：' + (e.message || '未知错误'), keyword);
  }finally{
    btn.classList.remove('loading');
  }
}

/* 飞流专用：加载更多 */
async function loadMoreFlix(){
  if(currentSource !== 'flixflop') return;
  if(!pageState.flixLastRank) {
    toast('没有更多了');
    return;
  }

  const src = SOURCES.flixflop;
  const moreBtn = $('#btnLoadMore');
  if(moreBtn){
    moreBtn.disabled = true;
    moreBtn.textContent = '加载中…';
  }

  try{
    const url = src.getNextPageUrl(pageState.currentKeyword, pageState.flixLastRank);
    const json = await requestUrl(url);
    const result = src.parseList(json);

    pageState.flixLastRank = result._lastRank || null;
    pageState.hasMore = result.hasMore;
    pageState.totalCount += result.list.length;

    if(result.list.length){
      renderCards(result.list, pageState.currentKeyword, true);
    } else {

async function gotoPage(targetUrl){

  window.scrollTo({ top:0, behavior:'smooth' });

    const html = await requestUrl(targetUrl);
    const result = SOURCES[currentSource].parseList(html);

    pageState.prevUrl     = result.prevUrl || '';
    pageState.nextUrl     = result.nextUrl || '';
    pageState.hasPrev     = !!result.hasPrev;
    pageState.hasMore     = !!result.hasMore;
    pageState.currentPage = result.currentPage || 1;
    pageState.totalPages  = result.totalPages || 1;
    pageState.totalCount  = result.totalCount || result.list.length;

    renderCards(result.list, pageState.currentKeyword, false);
  }catch(e){
    console.error(e);
    toast('加载页面失败：' + e.message);
    renderError('页面加载失败：' + (e.message || '未知错误'), pageState.currentKeyword);
  }
}

async function playEpisode(rawUrl, epIndex, lineName, epTitle) {
    const playerBox = $('#playerBox');
    const paddr = $('#paddr');

    const updateEpBtns = () => {
        const total = window._currentPlayList.length;
        const prevBtn = $('#btnPrevEp');
        const nextBtn = $('#btnNextEp');
        if (prevBtn) prevBtn.disabled = (epIndex <= 0);
        if (nextBtn) nextBtn.disabled = (epIndex >= total - 1);
    };

    // ★★★ 小蜜蜂：调 /api/play-url 拿真实 m3u8，用自己播放器 ★★★
    if (currentSource === 'xiaomifeng') {
        const cur = window._currentPlayList[epIndex];
        if(!cur || !cur.vodId){
            toast('缺少播放参数');
            updateEpBtns();                 // ← 新增
            return;
        }
        if (playerBox) playerBox.style.display = 'block';
        if (paddr) {
            paddr.className = 'paddr probing';
            paddr.textContent = '正在获取播放地址…';
        }
        try {
            const apiUrl = 'https://www.xmfyy.com/api/play-url'
                + '?vodId=' + cur.vodId
                + '&playFrom=' + cur.playFrom
                + '&index=' + cur.index;
            const json = await requestUrl(apiUrl);
            const data = JSON.parse(json);
            if(!data || !data.url){
                if(paddr){ paddr.className='paddr fail'; paddr.textContent='接口未返回播放地址'; }
                toast('接口未返回播放地址');
                updateEpBtns();             // ← 新增
                return;
            }
            if (paddr) {
                paddr.className = 'paddr ok';
                paddr.textContent = data.url;
            }
            startHlsPlayer(data.url);
            $('#dBody').scrollTo({ top: 0, behavior: 'smooth' });
        } catch(e) {
            console.error(e);
            toast('获取播放地址失败：' + e.message);
        }
        updateEpBtns();                     // ← 新增
        return;
    }
    // ★★★ 小蜜蜂分支结束 ★★★

    updateEpBtns();

    if (MEDIA_RE.test(rawUrl)) {
        if (playerBox) playerBox.style.display = 'block';
        if (paddr) {
            paddr.className = 'paddr ok';
            paddr.textContent = rawUrl;
        }
        startHlsPlayer(rawUrl);
        $('#dBody').scrollTo({ top: 0, behavior: 'smooth' });
        return;
    }

    if (playerBox) playerBox.style.display = 'none';
    if (paddr) {
        paddr.className = 'paddr probing';
        paddr.textContent = '正在解析播放地址…';
    }

    let page = '';
    let iframeUrl = '';
    let playUrl = '';
    try {
        page = await requestUrl(rawUrl);
        iframeUrl = extractPlayerIframe(page);
        if (!iframeUrl) playUrl = extractVideoUrl(page);
    } catch (e) {
        console.warn('播放页请求失败:', e);
        toast('播放页请求失败：' + (e.message || '网络错误'));
    }

    if (!detailOpen) return;

    if (iframeUrl) {
        const m3u8FromIframe = extractM3U8FromIframeUrl(iframeUrl);
        if (m3u8FromIframe) {
            if (playerBox) playerBox.style.display = 'block';
            if (paddr) {
                paddr.className = 'paddr ok';
                paddr.textContent = m3u8FromIframe;
            }
            startHlsPlayer(m3u8FromIframe);
            $('#dBody').scrollTo({ top: 0, behavior: 'smooth' });
            return;
        }
    }

    if (iframeUrl) {
        if (playerBox) playerBox.style.display = 'block';
        if (paddr) {
            paddr.className = 'paddr ok';
            paddr.textContent = iframeUrl;
        }
        playWithIframe(iframeUrl);
        $('#dBody').scrollTo({ top: 0, behavior: 'smooth' });
        toast('已启动播放器');
        return;
    }

    if (playUrl) {
        if (playerBox) playerBox.style.display = 'block';
        if (paddr) {
            paddr.className = 'paddr ok';
            paddr.textContent = playUrl;
        }
        startHlsPlayer(playUrl);
        $('#dBody').scrollTo({ top: 0, behavior: 'smooth' });
        return;
    }

    if (paddr) {
        paddr.className = 'paddr fail';
        paddr.textContent = '未解析到播放地址';
    }
    toast('未解析到播放地址，无法播放');
}

async function playAdjacent(delta) {
    const list = window._currentPlayList;
    if (!list || list.length === 0) return;
    
    let newIndex = window._currentEpIndex + delta;
    if (newIndex < 0 || newIndex >= list.length) {
        toast(delta < 0 ? '已经是第一集了' : '已经是最后一集了');
        return;
    }

    const p = list[newIndex];
    const lineName = p.lineName || '线路';
    const epTitle = p.epName || p.title || '正片';

    $$('.ep-btn').forEach(btn => {
        if (parseInt(btn.dataset.index, 10) === newIndex) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });

    const nowPlayingLabel = $('#nowPlayingLabel');
    if(nowPlayingLabel) {
        nowPlayingLabel.textContent = `[${lineName}] ${epTitle}`;
    }

    window._currentEpIndex = newIndex;

    const targetBtn = document.querySelector(`.ep-btn[data-index="${newIndex}"]`);
    if (targetBtn) {
        const group = targetBtn.closest('.line-group');
        if (group && !group.classList.contains('open')) {
            $$('.line-group').forEach(g => g.classList.remove('open'));
            group.classList.add('open');
        }
    }

    await playEpisode(p.url, newIndex, lineName, epTitle);
}

async function probePlayUrl(playPageUrl){
  const paddr = $('#paddrProbe');
  const playBtns = $('#playBtns');
  if(!paddr || !playBtns) return;

  // 每次进来先把状态重置
  paddr.className = 'paddr probing';
  paddr.textContent = '正在探测真实播放地址…';
  playBtns.style.display = 'none';

  let finalUrl = playPageUrl;
  let detected = false;

  try{
    const html = await requestUrl(playPageUrl);
    const v = extractVideoUrl(html);
    if(v){ finalUrl = v; detected = true; }
  }catch(e){
    console.warn('探测失败：', e.message);
  }

  if(!detailOpen) return;

  const copyBtn = playBtns.querySelector('.btn-play-copy');
  const openBtn = playBtns.querySelector('.btn-play-open');

  if(detected){
    /* ---------- 探测成功 ---------- */
    paddr.className = 'paddr ok';
    paddr.textContent = '';
    toast('已探测到播放地址');

    if(copyBtn){
      copyBtn.textContent = '复制链接';
      copyBtn.onclick = async function(){
        const ok = await copyText(finalUrl);
        if(ok){ copyFeedback(copyBtn, '已复制 ✓'); toast('播放地址已复制'); }
        else toast('复制失败');
      };
    }
    if(openBtn){
      openBtn.textContent = '点击播放';
      openBtn.onclick = function(){
        $('#playerBox').style.display = 'block';
        $('#paddr').textContent = finalUrl;
        startHlsPlayer(finalUrl);
        $('#dBody').scrollTo({ top:0, behavior:'smooth' });
      };
    }
    playBtns.style.display = 'flex';

  } else {
    /* ---------- 探测失败：保留重试入口 ---------- */
    paddr.className = 'paddr fail';
    paddr.textContent = '未探测到播放地址，可点击下方按钮重试';

    if(copyBtn){
      copyBtn.textContent = '复制页面链接';
      copyBtn.onclick = async function(){
        const ok = await copyText(playPageUrl);
        if(ok){ copyFeedback(copyBtn, '已复制 ✓'); toast('播放页链接已复制'); }
        else toast('复制失败');
      };
    }
    if(openBtn){
      openBtn.textContent = '重新探测';
      openBtn.onclick = function(){
        probePlayUrl(playPageUrl);   // ← 递归再探一次
      };
    }
    playBtns.style.display = 'flex';
  }
}

/* ============================================================
   片源横滑选择器（中间大 / 左右中 / 再外小；手势切换；active 永远居中）
   ============================================================ */
(function initSrcSwiper(){
  const swiper = document.getElementById('srcSwiper');
  const track  = document.getElementById('srcTrack');
  if(!swiper || !track) return;

  const SRC_LIST = [
    { src:'cilixiong', name:'磁力熊' },
    { src:'xiaomifeng', name:'小蜜蜂' },
    { src:'feikuai',    name:'飞快TV' },
    { src:'ffzy',       name:'非凡资源' },
    { src:'netflix',    name:'奈飞' },
    { src:'flixflop',   name:'飞流视频' },
    { src:'jiexi',      name:'视频解析' }
  ];


/* ★ 创建绿色导轨（固定不动，撑满屏幕） */
if(!swiper.querySelector('.src-rail')){
  const rail = document.createElement('div');
  rail.className = 'src-rail';
  swiper.insertBefore(rail, track);
}
  track.innerHTML = SRC_LIST.map(o =>
    `<button class="src-pill" data-source="${o.src}">${o.name}</button>`
  ).join('');

  const pills = Array.prototype.slice.call(track.querySelectorAll('.src-pill'));
  const N = pills.length;

  /* ★ 默认居中（双数偏左）：Math.floor((N-1)/2) */
  const defaultIdx = Math.floor((N - 1) / 2);
  const savedIdx   = SRC_LIST.findIndex(o => o.src === currentSource);
  let activeIdx = (savedIdx <= 0) ? defaultIdx : savedIdx;

  /* ★ 让 currentSource 跟默认 active 保持一致，视觉和数据一致 */
  currentSource = SRC_LIST[activeIdx].src;

  function applyClasses(){
    pills.forEach((p, i) => {
      p.classList.toggle('active', i === activeIdx);
      p.classList.toggle('near', Math.abs(i - activeIdx) === 1);
    });
  }

  /* ★ 用 translateX 让 active 永远居中 */
  function applyCenterOffset(withAnimation){
    const wrapW = swiper.clientWidth;
    const el = pills[activeIdx];
    if(!el) return;

    /* active 在 track 布局坐标系里的中心位置（offsetLeft 不受 transform 影响） */
    const activeCenterInTrack = el.offsetLeft + el.offsetWidth / 2;

    /* 目标位移 = 屏幕中心 - active 在 track 里的中心 */
    const offset = wrapW / 2 - activeCenterInTrack;

    if(withAnimation){
      track.style.transition = 'transform .35s cubic-bezier(.22,.8,.28,1)';
    } else {
      track.style.transition = 'none';
    }
    track.style.transform = 'translateX(' + offset + 'px)';
  }

  function layout(withAnimation){
    applyClasses();
    applyCenterOffset(withAnimation !== false);
  }

  function setActive(idx){
    if(idx < 0) idx = 0;
    if(idx >= N) idx = N - 1;
    if(idx === activeIdx){
      layout(true);
      return;
    }
    activeIdx = idx;
    const newSrc = SRC_LIST[idx].src;
    if(newSrc !== currentSource){
      switchSource(newSrc);
    }
    layout(true);
  }

  /* 点击 pill 切换 */
  pills.forEach((p, i) => {
    p.addEventListener('click', function(e){
      e.stopPropagation();
      setActive(i);
    });
  });

  /* ★ 手势切换：只检测滑动方向，列表本身不动 */
  let startX = 0, startY = 0, tracking = false, fired = false;
  const SWIPE_THRESHOLD = 30;

  function onDown(x, y){
    tracking = true; fired = false;
    startX = x; startY = y;
  }

  function onMove(x, y){
    if(!tracking || fired) return;
    const dx = x - startX;
    const dy = y - startY;

    /* 竖直滑动为主：放弃（让页面滚动） */
    if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 10) return;

    if(dx <= -SWIPE_THRESHOLD){
      fired = true;
      setActive(activeIdx + 1);
    } else if(dx >= SWIPE_THRESHOLD){
      fired = true;
      setActive(activeIdx - 1);
    }
  }

  function onUp(){
    tracking = false; fired = false;
  }

  track.addEventListener('mousedown', e => { e.preventDefault(); onDown(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onUp);

  track.addEventListener('touchstart', e => {
    const t = e.touches[0];
    onDown(t.clientX, t.clientY);
  }, { passive:true });
  track.addEventListener('touchmove', e => {
    const t = e.touches[0];
    onMove(t.clientX, t.clientY);
  }, { passive:true });
  track.addEventListener('touchend', onUp);
  track.addEventListener('touchcancel', onUp);

  let resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ layout(false); }, 120);
  });

  /* 初始化：无动画布局 */
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      layout(false);
    });
  });

  window.__srcSwiperSet = function(src){
    const idx = SRC_LIST.findIndex(o => o.src === src);
    if(idx < 0) return;
    activeIdx = idx;
    layout(true);
  };
})();

window.addEventListener('popstate', function(){
  if(detailOpen){
    detailOpen = false;
    closeDetailUI();
  }
});

$('#btnSearch').onclick = function(){ doSearch($('#kw').value); };

$('#kw').addEventListener('keydown', function(e){
  if(e.key === 'Enter' || e.keyCode === 13){
    e.preventDefault();
    doSearch($('#kw').value);
  }
});

$('#btnClose').onclick = closeDetail;

$('#mask').addEventListener('click', function(e){
  if(e.target.id === 'mask') closeDetail();
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeDetail();
});

$('#kw').value = '';
</script>
</body>
</html>
