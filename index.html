<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>影视搜索</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="title-row">
    <div class="title">
      <span class="dot"></span>
      影视快捷搜索
    </div>
    <div class="source-selector">
      <button class="src-btn active" data-source="cilixiong">磁力熊</button>
      <button class="src-btn" data-source="ffzy">非凡资源</button>
      <button class="src-btn" data-source="netflix">奈飞</button>
      <button class="src-btn" data-source="jiexi">视频解析</button>
    </div>
  </div>
  <div class="searchrow">
    <input id="kw" type="text" placeholder="电影名称" autocomplete="off">
    <button id="btnSearch">
      <span class="spinner"></span>
      <span class="btxt">搜索</span>
    </button>
  </div>
</div>

<div id="stat" class="stat" style="display:none"></div>
<div id="content"></div>

<div class="mask" id="mask">
  <div class="sheet">
    <div class="sheethead">
      <div class="thumb" id="dThumb"></div>
      <div class="info">
        <h2 id="dName">—</h2>
        <div class="meta" id="dMeta">—</div>
      </div>
      <button class="close" id="btnClose" aria-label="关闭">×</button>
    </div>
    <div class="sheetbody" id="dBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   全局配置与数据源定义
   ============================================================ */
const CONFIG = {
  relay: '/proxy?url=',
  timeout: 20000,
};

let currentSource = 'cilixiong';
let hlsInstance = null;
let detailOpen = false;
let currentDetailItem = null;

let pageState = {
  prevUrl: '',
  nextUrl: '',
  hasPrev: false,
  hasMore: false,
  currentPage: 1,
  totalPages: 1,
  totalCount: 0,
  currentKeyword: ''
};

const MEDIA_RE = /\.(m3u8|mp4|flv)(\?|#|$)/i;

const SOURCES = {
  /* ------------------------- 磁力熊 ------------------------- */
  cilixiong: {
    name: '磁力熊',
    base: 'https://www.cilixiong.org',
    searchPath: '/e/search/index.php',

    getSearchUrl: function(kw){
      return this.base + this.searchPath;
    },
    getSearchUrlGet: function(kw){
      return this.base + this.searchPath +
        '?searchget=1&classid=1,2&show=title&tempid=1&keyboard=' +
        encodeURIComponent(kw);
    },
    getSearchOptions: function(kw){
      const body = encodeForm({ classid:'1,2', show:'title', tempid:'1', keyboard: kw });
      return {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      };
    },

    parseList: function(html){
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const list = [];
      const seen = new Set();

      const pushItem = (nameEl, yearEl, rankEl, coverEl, href) => {
        if(!nameEl) return;
        const name = nameEl.textContent.trim();
        if(!name || seen.has(href + name)) return;
        seen.add(href + name);

        let cover = '';
        if(coverEl){
          const bg = coverEl.getAttribute('style') || '';
          const m = bg.match(/url\(['"]?([^'")]+)['"]?\)/);
          if(m) cover = m[1];
        }
        list.push({
          name,
          year: yearEl ? yearEl.textContent.trim() : '',
          rank: rankEl ? rankEl.textContent.trim() : '',
          cover: abs(cover, this.base),
          href: abs(href, this.base)
        });
      };

      doc.querySelectorAll('.card.card-cover').forEach(card => {
        const a = card.closest('a') || card.querySelector('a');
        if(!a) return;
        pushItem(
          card.querySelector('.pt-5.lh-1.pb-2.h4') || card.querySelector('h2'),
          card.querySelector('.d-flex.align-items-center.small'),
          card.querySelector('.rank'),
          card.querySelector('.card-img'),
          a.getAttribute('href')
        );
      });

      if(list.length === 0){
        doc.querySelectorAll('a[href*="/movie/"]').forEach(a => {
          const card = a.querySelector('.card') || a;
          pushItem(
            card.querySelector('.pt-5.lh-1.pb-2.h4') || card.querySelector('h2'),
            card.querySelector('.d-flex.align-items-center.small'),
            card.querySelector('.rank'),
            card.querySelector('.card-img'),
            a.getAttribute('href')
          );
        });
      }

      return {
        list,
        prevUrl:'', nextUrl:'', hasPrev:false, hasMore:false,
        currentPage:1, totalPages:1, totalCount: list.length
      };
    },

    parseDetail: function(html){
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const magnets = [];
      const seen = new Set();

      doc.querySelectorAll('a[href^="magnet:"]').forEach(a => {
        const href = a.getAttribute('href');
        if(!href || seen.has(href)) return;
        seen.add(href);
        const text = a.textContent.trim();
        let size = '';
        const m = text.match(/\[([^\]]+)\]\s*$/);
        if(m) size = m[1];
        magnets.push({ title: text || '磁力资源', size, magnet: href });
      });

      let playPageUrl = '';
      const iframe = doc.querySelector('.embed_video iframe') || doc.querySelector('iframe[src*="jx.php"]');
      if(iframe){
        const src = iframe.getAttribute('src') || '';
        if(src) playPageUrl = abs(src, this.base);
      }

      return { magnets, playPageUrl, playList: [] };
    }
  },

  /* ------------------------ 非凡资源 ------------------------ */
  ffzy: {
    name: '非凡资源',
    base: 'https://www.ffzy.tv',

    getSearchUrl: function(kw){
      return this.base + '/index.php/vod/search.html';
    },
    getSearchUrlGet: function(kw){
      return this.base + '/index.php/vod/search.html?wd=' + encodeURIComponent(kw);
    },
    getSearchOptions: function(kw){
      const body = encodeForm({ wd: kw });
      return {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      };
    },

    parseList: function(html){
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const list = [];

      let items = doc.querySelectorAll('ul.videoContent > li');
      if(items.length === 0) items = doc.querySelectorAll('a.videoName');

      items.forEach(node => {
        let a = null;
        let scope = node;
        if(node.tagName === 'A'){
          a = node;
          scope = node.closest('li') || node;
        }else{
          a = node.querySelector('a.videoName') || node.querySelector('a.address');
        }
        if(!a) return;

        const href = a.getAttribute('href');
        if(!href) return;

        const clone = a.cloneNode(true);
        const statusEl = clone.querySelector('i');
        const status = statusEl ? statusEl.textContent.trim() : '';
        if(statusEl) statusEl.remove();
        const name = clone.textContent.trim() || '未知片名';

        const regionEl = scope.querySelector('.region');
        const typeEl   = scope.querySelector('.category') || scope.querySelector('.type');
        const timeEl   = scope.querySelector('.time1')    || scope.querySelector('.time');

        list.push({
          name,
          year:   timeEl   ? timeEl.textContent.trim()   : '',
          rank:   typeEl   ? typeEl.textContent.trim()   : '',
          region: regionEl ? regionEl.textContent.trim() : '',
          status,
          cover: '',
          href:  abs(href, this.base)
        });
      });

      let prevUrl = '', nextUrl = '';
      let hasPrev = false, hasMore = false;
      let currentPage = 1, totalPages = 1, totalCount = list.length;

      const pageBox = doc.querySelector('.pages') || doc.querySelector('.page') || doc.querySelector('.kscont');
      if(pageBox){
        const prevA = pageBox.querySelector('a[title="上一页"]');
        if(prevA){
          const phref = prevA.getAttribute('href') || '';
          if(phref && !phref.includes('javascript:') && phref !== '#'){
            prevUrl = abs(phref, this.base);
            hasPrev = true;
          }
        }

        const nextA = pageBox.querySelector('a[title="下一页"]');
        if(nextA){
          const nhref = nextA.getAttribute('href') || '';
          if(nhref && !nhref.includes('javascript:') && nhref !== '#'){
            nextUrl = abs(nhref, this.base);
            hasMore = true;
          }
        }

        const statSpan = pageBox.querySelector('span.disabled') || pageBox;
        const text = statSpan ? (statSpan.textContent || '') : '';
        const m = text.match(/共\s*(\d+)\s*条数据.*?当前\s*(\d+)\s*\/\s*(\d+)\s*页/);
        if(m){
          totalCount  = parseInt(m[1], 10) || list.length;
          currentPage = parseInt(m[2], 10) || 1;
          totalPages  = parseInt(m[3], 10) || 1;
        }else{
          const activeSpan = pageBox.querySelector('span.active');
          if(activeSpan){
            const num = parseInt(activeSpan.textContent, 10);
            if(!isNaN(num)) currentPage = num;
          }
        }
      }

      if(currentPage <= 1){ hasPrev = false; prevUrl = ''; }
      if(currentPage >= totalPages){ hasMore = false; nextUrl = ''; }

      return { list, prevUrl, nextUrl, hasPrev, hasMore, currentPage, totalPages, totalCount };
    },

    parseDetail: function(html){
      const doc = new DOMParser().parseFromString(html, 'text/html');

      let cover = '';
      const imgEl = doc.querySelector('.left img') || doc.querySelector('.vodImg img');
      if(imgEl) cover = abs(imgEl.getAttribute('src'), this.base);

      const playList = [];
      const seen = new Set();

      doc.querySelectorAll('input[name*="copy_ffm3u8"]').forEach(ipt => {
        const val = (ipt.value || '').trim();
        if(!val.includes('$')) return;
        const idx = val.indexOf('$');
        const quality = val.slice(0, idx).trim() || '正片';
        const url     = val.slice(idx + 1).trim();
        if(!url || seen.has(url)) return;
        seen.add(url);
        playList.push({ title: quality, url });
      });

      if(playList.length === 0){
        const text = doc.body ? (doc.body.innerText || doc.body.textContent || '') : '';
        for(const m of text.matchAll(/([^\n\$]+?)\$((?:https?:\/\/)[^\s\$\n]+?\.m3u8[^\s\$\n]*)/gi)){
          const quality = m[1].trim();
          const url = m[2].trim();
          if(seen.has(url)) continue;
          seen.add(url);
          playList.push({ title: quality, url });
        }
      }

      return { cover, magnets: [], playPageUrl: '', playList };
    }
  },

  /* -------------------------- 奈飞 -------------------------- */
  netflix: {
    name: '奈飞',
    base: 'https://www.netflixgc.com',

    getSearchUrl: function(kw){
      return this.base + '/vodsearch/-------------.html?wd=' + encodeURIComponent(kw);
    },
    getSearchUrlGet: function(kw){
      return this.base + '/vodsearch/-------------.html?wd=' + encodeURIComponent(kw);
    },
    getSearchOptions: function(kw){
      return { method: 'GET' };
    },

    parseList: function(html){
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const list = [];
      const seen = new Set();

      const pickCover = (scope) => {
        const img = scope.querySelector ? scope.querySelector('.detail-pic img') || scope.querySelector('img') : null;
        if(!img) return '';
        return img.getAttribute('data-src') || img.getAttribute('src') || '';
      };

      const boxes = doc.querySelectorAll('.public-list-box');
      if(boxes.length){
        boxes.forEach(box => {
          const a = box.querySelector('a[href*="/voddetail/"]');
          if(!a) return;
          const href = a.getAttribute('href') || '';
          if(!href || seen.has(href)) return;

          const titleEl = box.querySelector('.slide-info-title') || box.querySelector('h3');
          const name = titleEl ? titleEl.textContent.trim() : '';
          if(!name) return;

          seen.add(href);

          const noteEl = box.querySelector('.public-list-prb') ||
                         box.querySelector('.slide-info-remarks');

          list.push({
            name,
            year: noteEl ? noteEl.textContent.trim() : '',
            rank: '',
            cover: abs(pickCover(box), this.base),
            href: abs(href, this.base)
          });
        });
      }

      if(list.length === 0){
        doc.querySelectorAll('a[href*="/voddetail/"]').forEach(a => {
          const href = a.getAttribute('href') || '';
          if(!href || seen.has(href)) return;

          const scope = a.closest('.public-list-box') ||
                        a.closest('li') ||
                        a.parentElement || a;

          const titleEl = scope.querySelector
            ? (scope.querySelector('.slide-info-title') || scope.querySelector('h3'))
            : null;
          const name = titleEl ? titleEl.textContent.trim() : a.textContent.trim();
          if(!name || name.length > 60) return;

          seen.add(href);

          list.push({
            name,
            year: '',
            rank: '',
            cover: abs(pickCover(scope), this.base),
            href: abs(href, this.base)
          });
        });
      }

      return {
        list,
        prevUrl:'', nextUrl:'', hasPrev:false, hasMore:false,
        currentPage:1, totalPages:1, totalCount: list.length
      };
    },

    parseDetail: function(html){
      const doc = new DOMParser().parseFromString(html, 'text/html');

      let cover = '';
      const imgEl = doc.querySelector('.detail-pic img') || doc.querySelector('.vodImg img');
      if(imgEl) cover = abs(imgEl.getAttribute('data-src') || imgEl.getAttribute('src'), this.base);

      const tabs = doc.querySelectorAll('.vod-playerUrl');
      const boxes = doc.querySelectorAll('.anthology-list-box');

      const playList = [];
      const seen = new Set();

      const total = Math.max(tabs.length, boxes.length);

      for(let i = 0; i < total; i++){
        let lineName = '';
        if(tabs[i]){
          const clone = tabs[i].cloneNode(true);
          clone.querySelectorAll('.badge, i').forEach(el => el.remove());
          lineName = (clone.textContent || '').replace(/\s+/g, ' ').trim();
        }
        if(!lineName) lineName = '线路' + (i + 1);

        const box = boxes[i];
        if(!box) continue;

        box.querySelectorAll('a[href*="/vodplay/"]').forEach(a => {
          const href = a.getAttribute('href') || '';
          if(!href || seen.has(href)) return;
          seen.add(href);

          const sp = a.querySelector('span');
          let epName = sp ? sp.textContent.trim() : (a.textContent || '').trim();
          if(!epName) epName = '正片';

          playList.push({
            title: lineName + ' · ' + epName,
            url: abs(href, this.base)
          });
        });
      }

      return { cover, magnets: [], playPageUrl: '', playList };
    }
  }
};

/* ============================================================
   通用工具函数
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));

function toast(msg){
  const t = $('#toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 1600);
}

function encodeForm(obj){
  return Object.keys(obj)
    .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(obj[k]))
    .join('&');
}

function abs(url, base){
  if(!url) return '';
  url = String(url).trim();
  if(!url) return '';
  if(url.startsWith('http://') || url.startsWith('https://')) return url;
  if(url.startsWith('//')) return 'https:' + url;
  return base + (url.startsWith('/') ? '' : '/') + url;
}

function fetchWithTimeout(url, options, timeout){
  timeout = timeout || CONFIG.timeout;
  const ctrl = new AbortController();
  const id = setTimeout(()=>ctrl.abort(), timeout);
  return fetch(url, Object.assign({}, options || {}, { signal: ctrl.signal }))
    .finally(()=>clearTimeout(id));
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      return true;
    }catch(err){
      return false;
    }
  }
}

function copyFeedback(btn, label){
  if(!btn) return;
  const old = btn.textContent;
  btn.classList.add('done');
  btn.textContent = label;
  setTimeout(()=>{
    btn.classList.remove('done');
    btn.textContent = old;
  }, 1400);
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s){
  return escapeHtml(s).replace(/`/g,'&#96;');
}

/* ============================================================
   ★ 智能解码：处理 %uXXXX + 多次 URL 解码
   - 例：%u7B2C%30%31%u96C6 → 第01集
   - 例：%68%74%74%70%73 → https
   ============================================================ */
function smartDecode(raw){
  if(!raw) return '';
  let s = String(raw);

  // 1. 处理 %uXXXX（JS escape 格式）
  s = s.replace(/%u([0-9a-fA-F]{4})/g, function(_, hex){
    return String.fromCharCode(parseInt(hex, 16));
  });

  // 2. 标准 URL 解码，最多 2 次
  for(let i = 0; i < 2; i++){
    try {
      const d = decodeURIComponent(s);
      if(d === s) break;
      s = d;
    } catch(e){ break; }
  }
  return s;
}

/* 规范化 URL：中文/空格编码成 %xx */
function normalizeUrl(u){
  if(!u) return u;
  try { return new URL(u).href; }
  catch(e) {
    return u.replace(/[\u4e00-\u9fa5\s]/g, c => encodeURIComponent(c));
  }
}

/* ============================================================
   核心：从播放页 HTML 中提取真正的 m3u8
   ============================================================ */
function extractVideoUrl(text){
  if(!text) return '';

  let s = String(text)
    .replace(/\\\//g, '/')
    .replace(/&amp;/g, '&')
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'")
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>');

  const normalize = normalizeUrl;

  // ★ 1. 优先：从 url= 参数里尝试解码（处理 %uXXXX 和 URL 编码）
  //    例：url=%68%74%74%70%73%3A%2F%2F... → https://...
  //    例：url=...%u7B2C%30%31%u96C6... → ...第01集...
  const urlAnyRe = /[?&]url=([^&\s"'<>]+)/gi;
  let m;
  while((m = urlAnyRe.exec(s)) !== null){
    const decoded = smartDecode(m[1]);
    if(/^https?:\/\//i.test(decoded) && MEDIA_RE.test(decoded)){
      return normalize(decoded);
    }
  }

  // 2. url= 里直接是 http 开头的明文媒体地址
  const urlParamRe = /[?&]url=(https?:\/\/[^\s"'<>&]+?\.(?:m3u8|mp4|flv)[^\s"'<>&]*)/gi;
  while((m = urlParamRe.exec(s)) !== null){
    const u = m[1];
    if(MEDIA_RE.test(u)) return normalize(u);
  }

  // 3. iframe 的 src 提取
  const iframeRe = /<iframe\b[^>]*?\bsrc\s*=\s*["']([^"']+)["']/gi;
  while((m = iframeRe.exec(s)) !== null){
    const src = m[1];
    const urlMatch = src.match(/[?&]url=([^"']+)/i);
    if(urlMatch){
      const decoded = smartDecode(urlMatch[1]);
      if(MEDIA_RE.test(decoded)) return normalize(decoded);
    }
    if(MEDIA_RE.test(src)) return normalize(src);

    const mm = src.match(/https?:\/\/[^\s"'<>\\]+?\.(m3u8|mp4|flv)[^\s"'<>\\]*/i);
    if(mm) return normalize(mm[0]);
  }

  // 4. 兜底：整个 HTML 里搜媒体地址
  const patterns = [
    /https?:\/\/[^\s"'<>\\]+?\.m3u8[^\s"'<>\\]*/i,
    /https?:\/\/[^\s"'<>\\]+?\.mp4[^\s"'<>\\]*/i,
    /https?:\/\/[^\s"'<>\\]+?\.flv[^\s"'<>\\]*/i,
  ];
  for(let i=0;i<patterns.length;i++){
    const mm = s.match(patterns[i]);
    if(mm) return normalize(mm[0]);
  }
  return '';
}

/* ============================================================
   从播放页 HTML 里提取 iframe 的 src（如奈飞的 ec.php）
   ============================================================ */
function extractIframeSrc(html){
  if(!html) return '';
  const s = String(html).replace(/&amp;/g, '&');
  const re = /<iframe\b[^>]*?\bsrc\s*=\s*["']([^"']+)["'][^>]*>/gi;
  let m;
  while((m = re.exec(s)) !== null){
    let src = m[1].replace(/&quot;/g, '"').trim();
    if(src.startsWith('//')) src = 'https:' + src;
    if(/^https?:/i.test(src)) return src;
  }
  return '';
}

/* ============================================================
   ★ 从 player_aaaa 变量里拼出 ec.php 的 iframe 地址
   - 奈飞播放页原始 HTML 里没有 iframe，只有 player_aaaa 变量
   - 变量里的 url 经过 base64 + URL 编码，解码后得到加密 token
   - 拼成 https://cjbfq.netflixgc.tv/player/ec.php?code=netflix&if=1&url=<token>
   ============================================================ */
function extractIframeFromPlayerData(html){
  if(!html) return '';

  const m = html.match(/var\s+player_aaaa\s*=\s*(\{[\s\S]*?\})\s*;?\s*(?:<\/script>|$)/);
  if(!m) return '';

  let obj;
  try {
    obj = JSON.parse(m[1]);
  } catch(e){
    return '';
  }
  if(!obj || !obj.url) return '';

  // base64 解码
  let decoded = '';
  try {
    decoded = atob(obj.url);
  } catch(e){
    return '';
  }

  // ★ 用 smartDecode 处理 %uXXXX + URL 解码
  decoded = smartDecode(decoded);

  // 如果解码后直接是明文 m3u8，让上层 extractVideoUrl 处理
  if(/^https?:\/\//i.test(decoded) && MEDIA_RE.test(decoded)){
    return '';
  }

  // 是加密 token → 拼 ec.php
  return 'https://cjbfq.netflixgc.tv/player/ec.php?code=netflix&if=1&url=' + obj.url;
}

/* ============================================================
   ★ 从 player_aaaa 里直接解出明文 m3u8
   ============================================================ */
function extractM3U8FromPlayerData(html){
  if(!html) return '';
  const m = html.match(/var\s+player_aaaa\s*=\s*(\{[\s\S]*?\})\s*;?\s*(?:<\/script>|$)/);
  if(!m) return '';
  let obj;
  try { obj = JSON.parse(m[1]); } catch(e){ return ''; }
  if(!obj || !obj.url) return '';

  let decoded = '';
  try { decoded = atob(obj.url); } catch(e){ return ''; }
  decoded = smartDecode(decoded);

  if(/^https?:\/\//i.test(decoded) && MEDIA_RE.test(decoded)){
    return normalizeUrl(decoded);
  }
  return '';
}

/* ============================================================
   ★ 从 ec.php 的 url= 参数里解出明文 m3u8（URL 编码的情况）
   - 例：ec.php?...&url=%68%74%74%70%73%3A%2F%2F...index.m3u8
   - 例：ec.php?...&url=...%u7B2C%30%31%u96C6...index.m3u8
   - 加密 token（NBY-XMYAES...）解不出，返回空
   ============================================================ */
function extractM3U8FromIframeUrl(iframeUrl){
  if(!iframeUrl) return '';
  const m = iframeUrl.match(/[?&]url=([^&\s"'<>]+)/i);
  if(!m) return '';
  const decoded = smartDecode(m[1]);
  if(/^https?:\/\//i.test(decoded) && MEDIA_RE.test(decoded)){
    return normalizeUrl(decoded);
  }
  return '';
}

/* ============================================================
   HLS 播放
   ============================================================ */
function destroyHls(){
  const video = document.getElementById('playerVideo');
  if(video){
    try{ video.pause(); }catch(e){}
    try{ video.removeAttribute('src'); video.load(); }catch(e){}
  }
  const iframe = document.getElementById('playerIframe');
  if(iframe){
    try{ iframe.src = 'about:blank'; iframe.style.display = 'none'; }catch(e){}
  }
  if(hlsInstance){
    try{ hlsInstance.destroy(); }catch(e){}
    hlsInstance = null;
  }
}

function startHlsPlayer(videoUrl){
  const container = $('#playerContainer');
  const video = $('#playerVideo');
  const iframe = $('#playerIframe');
  if(!container || !video || !videoUrl) return;

  destroyHls();
  container.style.display = 'block';
  if(iframe){ iframe.style.display = 'none'; }
  if(video) video.style.display = 'block';

  const playSrc = CONFIG.relay + encodeURIComponent(videoUrl);

  if(typeof Hls !== 'undefined' && Hls.isSupported()){
    hlsInstance = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      manifestLoadingTimeOut: 20000,
      manifestLoadingMaxRetry: 3,
      fragLoadingTimeOut: 20000,
      fragLoadingMaxRetry: 3,
    });

    hlsInstance.loadSource(playSrc);
    hlsInstance.attachMedia(video);

    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function(){
      video.play().catch(function(e){ console.log('自动播放被拦截:', e); });
    });

    hlsInstance.on(Hls.Events.ERROR, function(event, data){
      if(!data || !data.fatal) return;
      switch(data.type){
        case Hls.ErrorTypes.NETWORK_ERROR:
          toast('视频加载失败：网络错误');
          break;
        case Hls.ErrorTypes.MEDIA_ERROR:
          try{ hlsInstance.recoverMediaError(); }catch(e){ toast('视频解码失败'); }
          break;
        default:
          destroyHls();
          toast('播放器遇到致命错误');
          break;
      }
    });
  }
  else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = playSrc;
    video.addEventListener('loadedmetadata', function(){
      video.play().catch(function(){});
    }, { once:true });
  }
  else{
    toast('当前浏览器不支持 HLS 播放');
  }
}

/* ============================================================
   用 iframe 播放（用于加密 token 的站点，如奈飞的 ec.php）
   ============================================================ */
function playWithIframe(iframeSrc){
  if(!iframeSrc) return;

  const container = $('#playerContainer');
  const video = $('#playerVideo');
  const iframe = $('#playerIframe');
  if(!container || !iframe) return;

  if(hlsInstance){
    try{ hlsInstance.destroy(); }catch(e){}
    hlsInstance = null;
  }
  if(video){
    try{ video.pause(); }catch(e){}
    try{ video.removeAttribute('src'); video.load(); }catch(e){}
    video.style.display = 'none';
  }

  container.style.display = 'block';
  iframe.style.display = 'block';
  iframe.src = iframeSrc;
}

/* ============================================================
   网络请求与代理通信
   ============================================================ */
let lastReceivedCookie = '';

async function fetchViaRelay(url, opts, timeout){
  const target = CONFIG.relay + encodeURIComponent(url);
  const options = opts || {};
  const headers = options.headers || {};

  if (lastReceivedCookie) {
    headers['x-target-cookie'] = lastReceivedCookie;
  }
  options.headers = headers;

  const r = await fetchWithTimeout(target, options, timeout);

  const setCookie = r.headers.get('x-set-cookie');
  if (setCookie) {
    const m = setCookie.match(/cdndefend_js_cookie=[^;]+/);
    if (m) {
      lastReceivedCookie = m[0];
    }
  }

  if(!r.ok) {
    throw new Error('网络请求服务响应异常 (' + r.status + ')');
  }
  return await r.text();
}

async function requestSearch(keyword) {
  const src = SOURCES[currentSource];
  const postOpts = src.getSearchOptions(keyword);
  let txt = '';
  try {
    txt = await fetchViaRelay(src.getSearchUrl(keyword), postOpts);
  } catch (e) {
    txt = await fetchViaRelay(src.getSearchUrlGet(keyword), { method: 'GET' });
  }
  return txt;
}

async function requestUrl(url){
  return await fetchViaRelay(url, {});
}

/* ============================================================
   核心业务
   ============================================================ */
async function doSearch(keyword){
  keyword = (keyword || '').trim();
  if(!keyword){ toast('请输入关键词'); return; }

  pageState.currentKeyword = keyword;
  pageState.prevUrl = '';
  pageState.nextUrl = '';
  pageState.hasPrev = false;
  pageState.hasMore = false;

  const btn = $('#btnSearch');
  btn.classList.add('loading');
  renderSkeleton();

  try{
    const html = await requestSearch(keyword);
    const result = SOURCES[currentSource].parseList(html);

    pageState.prevUrl     = result.prevUrl || '';
    pageState.nextUrl     = result.nextUrl || '';
    pageState.hasPrev     = !!result.hasPrev;
    pageState.hasMore     = !!result.hasMore;
    pageState.currentPage = result.currentPage || 1;
    pageState.totalPages  = result.totalPages || 1;
    pageState.totalCount  = result.totalCount || result.list.length;

    renderCards(result.list, keyword);
  }catch(e){
    console.error(e);
    renderError('请求失败：' + (e.message || '未知错误'), keyword);
  }finally{
    btn.classList.remove('loading');
  }
}

async function gotoPage(targetUrl){
  if(!targetUrl) return;

  renderSkeleton();
  window.scrollTo({ top:0, behavior:'smooth' });

  try{
    const html = await requestUrl(targetUrl);
    const result = SOURCES[currentSource].parseList(html);

    pageState.prevUrl     = result.prevUrl || '';
    pageState.nextUrl     = result.nextUrl || '';
    pageState.hasPrev     = !!result.hasPrev;
    pageState.hasMore     = !!result.hasMore;
    pageState.currentPage = result.currentPage || 1;
    pageState.totalPages  = result.totalPages || 1;
    pageState.totalCount  = result.totalCount || result.list.length;

    renderCards(result.list, pageState.currentKeyword);
  }catch(e){
    console.error(e);
    toast('加载页面失败：' + e.message);
    renderError('页面加载失败：' + (e.message || '未知错误'), pageState.currentKeyword);
  }
}

      }).join('');
    }

      (detailData.magnets && detailData.magnets.length) ||
      (detailData.playList && detailData.playList.length);

    if(!hasAnything){
      body += '<div class="empty" style="padding:30px 0"><p>该影片暂未解析到磁力或播放地址</p></div>';

    $$('#dBody .btn-open[data-magnet]').forEach(function(b){

        const ok = await copyText(b.dataset.url);
        if(ok){ copyFeedback(b, '已复制 ✓'); toast('播放链接已复制'); }
        else toast('复制失败');
      };
    });

    /* =========================================================
       播放按钮：五段式
       ① 直链 → HLS
       ② 播放页 → extractVideoUrl 拿到 m3u8 → HLS
       ③ 播放页 → player_aaaa 里拿到明文 m3u8 → HLS
       ④ iframeUrl → 尝试解出 url= 里的明文 m3u8 → HLS；解不出（加密 token）→ iframe 播放
       ⑤ 全部失败 → 提示
       ========================================================= */
    $$('#dBody .btn-play-ep').forEach(function(b){
      b.onclick = async function(){
        const rawUrl = b.dataset.url;
        if(!rawUrl) return;

        const playerBox = $('#playerBox');
        const paddr = $('#paddr');

        // ① 直链直接播放
        if(MEDIA_RE.test(rawUrl)){
          if(playerBox) playerBox.style.display = 'block';
          if(paddr){
            paddr.className = 'paddr ok';
            paddr.textContent = rawUrl;
          }
          startHlsPlayer(rawUrl);
          $('#dBody').scrollTo({ top:0, behavior:'smooth' });
          return;
        }

        // 请求播放页
        const old = b.textContent;
        b.textContent = '解析中…';
        b.disabled = true;
        if(paddr){
          paddr.className = 'paddr probing';
          paddr.textContent = '正在解析播放地址…';
        }
        if(playerBox) playerBox.style.display = 'none';

        let page = '';
        let playUrl = '';
        let iframeUrl = '';
        try{
          page = await requestUrl(rawUrl);

          // ② 常规提取 m3u8
          playUrl = extractVideoUrl(page);

          // ③ player_aaaa 里可能有明文 m3u8
          if(!playUrl) playUrl = extractM3U8FromPlayerData(page);

          // ④ 提取 iframe（或从 player_aaaa 拼 ec.php）
          iframeUrl = extractIframeSrc(page);
          if(!iframeUrl) iframeUrl = extractIframeFromPlayerData(page);

          console.log('[播放页]', rawUrl);
          console.log('[m3u8]', playUrl);
          console.log('[iframe]', iframeUrl);
        }catch(e){
          console.warn('播放页请求失败:', e);
          toast('播放页请求失败：' + (e.message || '网络错误'));
        }

        b.textContent = old;
        b.disabled = false;

        if(!detailOpen) return;

        // ②③ m3u8 → HLS
        if(playUrl){
          if(playerBox) playerBox.style.display = 'block';
          if(paddr){
            paddr.className = 'paddr ok';
            paddr.textContent = playUrl;
          }
          startHlsPlayer(playUrl);
          $('#dBody').scrollTo({ top:0, behavior:'smooth' });
          return;
        }

        // ④ iframeUrl 处理
        if(iframeUrl){
          // ④-1 先看 url= 里能不能解出明文 m3u8
          const m3u8FromIframe = extractM3U8FromIframeUrl(iframeUrl);
          if(m3u8FromIframe){
            console.log('[从 iframe url= 解出 m3u8]', m3u8FromIframe);
            if(playerBox) playerBox.style.display = 'block';
            if(paddr){
              paddr.className = 'paddr ok';
              paddr.textContent = m3u8FromIframe;
            }
            startHlsPlayer(m3u8FromIframe);
            $('#dBody').scrollTo({ top:0, behavior:'smooth' });
            return;
          }

          // ④-2 是加密 token → iframe 播放
          if(playerBox) playerBox.style.display = 'block';
          if(paddr){
            paddr.className = 'paddr ok';
            paddr.textContent = iframeUrl;
          }
          playWithIframe(iframeUrl);
          $('#dBody').scrollTo({ top:0, behavior:'smooth' });
          toast('已切换 iframe 模式播放');
          return;
        }

        // ⑤ 全部失败
        if(paddr){
          paddr.className = 'paddr fail';
          paddr.textContent = '未解析到播放地址';
        }
        toast('未解析到播放地址，无法播放');
      };
    });

    if(detailData.playPageUrl){
      probePlayUrl(detailData.playPageUrl);
    }

  }catch(e){
    console.error(e);
    if(!detailOpen) return;
    $('#dBody').innerHTML = '<div class="empty" style="padding:30px 0">' +
      '<p>加载失败：' + escapeHtml(e.message || '未知错误') + '</p></div>';
  }
}

async function probePlayUrl(playPageUrl){
  const paddr = $('#paddrProbe');
  const playBtns = $('#playBtns');
  if(!paddr || !playBtns) return;

  let finalUrl = playPageUrl;
  let detected = false;

  try{
    const html = await requestUrl(playPageUrl);
    const v = extractVideoUrl(html);
    if(v){ finalUrl = v; detected = true; }
  }catch(e){
    console.warn('探测失败：', e.message);
  }

  if(!detailOpen) return;

  if(detected){
    paddr.className = 'paddr ok';
    paddr.textContent = finalUrl;
    toast('已探测到播放地址');
  }else{
    paddr.className = 'paddr fail';
    paddr.textContent = '未探测到 m3u8/mp4，使用原始地址：' + finalUrl;
  }

  playBtns.style.display = 'flex';

  const copyBtn = playBtns.querySelector('.btn-play-copy');
  const openBtn = playBtns.querySelector('.btn-play-open');

  if(copyBtn){
    copyBtn.onclick = async function(){
      const ok = await copyText(finalUrl);
      if(ok){ copyFeedback(copyBtn, '已复制 ✓'); toast('播放地址已复制'); }
      else toast('复制失败');
    };
  }

  if(openBtn){
    openBtn.onclick = function(){
      $('#playerBox').style.display = 'block';
      $('#paddr').textContent = finalUrl;
      startHlsPlayer(finalUrl);
      $('#dBody').scrollTo({ top:0, behavior:'smooth' });
    };
  }
}

/* ============================================================
   事件初始化绑定
   ============================================================ */
window.addEventListener('popstate', function(){
  if(detailOpen){
    detailOpen = false;
    closeDetailUI();
  }
});

$$('.src-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    if(btn.classList.contains('active')) return;

    $$('.src-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    currentSource = btn.dataset.source;

    pageState.prevUrl = '';
    pageState.nextUrl = '';
    pageState.hasPrev = false;
    pageState.hasMore = false;
    pageState.currentPage = 1;
    pageState.totalPages = 1;
    pageState.totalCount = 0;

    if(currentSource === 'jiexi'){
      $('.searchrow').style.display = 'none';
      toast('已切换：视频解析');
      renderJiexiUI();
    }else{
      $('.searchrow').style.display = 'flex';
      toast('已切换数据源：' + SOURCES[currentSource].name);
      const kw = $('#kw').value.trim();
      if(kw){
        doSearch(kw);
      }else{
        $('#content').innerHTML = '';
        $('#stat').style.display = 'none';
      }
    }
  });
});

$('#btnSearch').onclick = function(){ doSearch($('#kw').value); };

$('#kw').addEventListener('keydown', function(e){
  if(e.key === 'Enter' || e.keyCode === 13){
    e.preventDefault();
    doSearch($('#kw').value);
  }
});

$('#btnClose').onclick = closeDetail;

$('#mask').addEventListener('click', function(e){
  if(e.target.id === 'mask') closeDetail();
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeDetail();
});

$('#kw').value = '';
</script>
